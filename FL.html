<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>For My Love</title>
    <style>
        /* Background Gradient Animation */
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            width: 100vw;
            background: linear-gradient(-45deg, #fff0f5, #ffffff, #ffe4e1, #fff5f8);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* BIG WHITE SQUARE (The Mail Card) */
        .mail-card {
            position: absolute;
            width: 260px;
            height: 260px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 40px;
            box-shadow: 0 25px 50px rgba(255, 107, 129, 0.15), inset 0 0 0 2px rgba(255, 255, 255, 1);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 5;
            transition: all 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .mail-card.opened {
            opacity: 0;
            transform: scale(0.5) translateY(150px);
            pointer-events: none;
        }

        /* Mail Container */
        .mail-wrapper {
            position: relative;
            width: 120px;
            height: 120px;
            z-index: 10;
            filter: drop-shadow(0px 10px 15px rgba(255, 107, 129, 0.3));
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            -webkit-tap-highlight-color: transparent;
        }
        
        .mail-wrapper.ready {
            cursor: pointer;
            animation: pulseMail 1.5s infinite alternate;
        }

        @keyframes pulseMail {
            0% { transform: scale(1); filter: drop-shadow(0px 10px 15px rgba(255, 107, 129, 0.4)); }
            100% { transform: scale(1.1); filter: drop-shadow(0px 15px 25px rgba(255, 107, 129, 0.7)); }
        }

        .mail-wrapper.opened {
            opacity: 0;
            transform: scale(0);
            pointer-events: none;
        }

        .mail-icon {
            width: 100%;
            height: 100%;
            color: #ff6b81; 
        }

        /* Notification Badge */
        .badge {
            position: absolute;
            top: -5px;
            right: -10px;
            background-color: #ff4757;
            color: white;
            font-size: 20px;
            font-weight: 800;
            padding: 4px 12px;
            border-radius: 20px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            border: 3px solid #fff;
            opacity: 0;
            transform: scale(0);
            transition: opacity 0.3s, transform 0.3s;
        }

        .pop {
            animation: popBadge 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popBadge {
            0% { transform: scale(1); }
            50% { transform: scale(1.3); }
            100% { transform: scale(1); }
        }

        /* Identity Check Paper */
        .paper-container {
            position: absolute;
            width: 320px;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.15);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            box-sizing: border-box;
            
            opacity: 0;
            pointer-events: none;
            transform: translateY(50px) scale(0.8);
            transition: all 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            z-index: 20;
        }

        .paper-container.active {
            opacity: 1;
            pointer-events: all;
            transform: translateY(0) scale(1);
        }

        .paper-title {
            color: #2f3542;
            font-size: 1.5rem;
            letter-spacing: 2px;
            margin: 0 0 30px 0;
            text-transform: uppercase;
            font-weight: 900;
            border-bottom: 2px dashed #ced6e0;
            padding-bottom: 10px;
            width: 100%;
            text-align: center;
        }

        /* Scanner Area */
        .scanner-wrapper {
            position: relative;
            width: 140px;
            height: 140px;
            cursor: pointer;
            border-radius: 50%;
            background: #f1f2f6;
            padding: 20px;
            box-shadow: inset 0 4px 8px rgba(0,0,0,0.05);
            transition: transform 0.2s, box-shadow 0.2s;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            touch-action: none; 
            -webkit-tap-highlight-color: transparent;
        }

        .scanner-wrapper:active, .scanner-wrapper.holding {
            transform: scale(0.92);
            box-shadow: inset 0 8px 15px rgba(0,0,0,0.1);
        }

        /* Fingerprint SVGs */
        .fingerprint {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 90px;
            height: 90px;
        }

        .fingerprint path {
            fill: none;
            stroke-width: 2.5;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        
        .fingerprint.base path { stroke: #dfe4ea; }
        .fingerprint.fill path {
            stroke: #ff4757;
            stroke-dasharray: 1;
            stroke-dashoffset: 1;
            transition: stroke-dashoffset 0.4s ease-out; 
        }

        .fingerprint.fill path:nth-child(even) { stroke-dashoffset: -1; }
        .fingerprint.fill.scanning path { stroke-dashoffset: 0 !important; }

        .fingerprint.fill.scanning path:nth-child(1n) { transition: stroke-dashoffset 2.8s ease-in-out 0.1s; }
        .fingerprint.fill.scanning path:nth-child(2n) { transition: stroke-dashoffset 2.4s ease-in-out 0.2s; }
        .fingerprint.fill.scanning path:nth-child(3n) { transition: stroke-dashoffset 2.9s ease-in-out 0.0s; }
        .fingerprint.fill.scanning path:nth-child(4n) { transition: stroke-dashoffset 2.5s ease-in-out 0.3s; }
        .fingerprint.fill.scanning path:nth-child(5n) { transition: stroke-dashoffset 3.0s ease-in-out 0.1s; }
        .fingerprint.fill.scanning path:nth-child(7n) { transition: stroke-dashoffset 2.6s ease-in-out 0.4s; }

        .fingerprint.fill.verified path {
            stroke-dashoffset: 0 !important;
            transition: none !important;
        }

        .status-text {
            margin-top: 30px;
            color: #747d8c;
            font-size: 1.1rem;
            font-weight: 600;
            height: 24px;
            transition: color 0.3s;
        }

        /* CHIYUKI Bubble Text Wrapper */
        .chiyuki-wrapper {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transform: scale(0.5);
            transition: all 1.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 50;
        }

        .chiyuki-wrapper.show {
            opacity: 1;
            transform: scale(1);
            pointer-events: all;
        }

        .bubble-text {
            font-family: 'Nunito', 'Arial Rounded MT Bold', 'Comic Sans MS', sans-serif;
            font-size: 4.5rem;
            font-weight: 900;
            color: #ff6b81;
            letter-spacing: 2px;
            margin: 0;
            text-align: center;
            text-shadow: 
                -3px -3px 0 #fff, 3px -3px 0 #fff, -3px 3px 0 #fff, 3px 3px 0 #fff,
                -7px -7px 0 #ffe4e1, 7px -7px 0 #ffe4e1, -7px 7px 0 #ffe4e1, 7px 7px 0 #ffe4e1,
                0px 15px 25px rgba(255, 107, 129, 0.4);
            animation: floatBubble 2.5s ease-in-out infinite alternate;
        }

        @keyframes floatBubble {
            0% { transform: translateY(0px) rotate(-3deg) scale(1); }
            100% { transform: translateY(-20px) rotate(3deg) scale(1.05); }
        }

        /* Photo Gallery Layout */
        .photo-gallery {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
            margin-top: 30px;
            max-width: 95vw;
        }

        /* Polaroid Photo Frame */
        .photo-frame {
            position: relative;
            width: 130px;
            height: 130px;
            background: white;
            padding: 10px;
            padding-bottom: 35px;
            border-radius: 8px;
            box-shadow: 0 15px 35px rgba(255, 107, 129, 0.4), inset 0 0 0 1px rgba(0,0,0,0.05);
            cursor: pointer;
            transition: transform 0.3s, filter 0.5s;
            -webkit-tap-highlight-color: transparent;
        }

        .photo-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 4px;
            background-color: #f1f2f6;
        }

        /* Lock Effect for Pictures 2 and 3 */
        .photo-frame.locked {
            filter: grayscale(100%) brightness(0.8);
            cursor: not-allowed;
            pointer-events: none; /* Prevents clicking */
        }
        
        .photo-frame.locked::after {
            content: "🔒";
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 3rem;
            filter: drop-shadow(0px 4px 6px rgba(0,0,0,0.4));
        }

        .frame-1 { animation: floatPhoto1 3.5s ease-in-out infinite alternate 0.1s; }
        .frame-2 { animation: floatPhoto2 3.1s ease-in-out infinite alternate 0.4s; }
        .frame-3 { animation: floatPhoto3 3.3s ease-in-out infinite alternate 0.7s; }

        @keyframes floatPhoto1 { 0% { transform: translateY(0px) rotate(-8deg); } 100% { transform: translateY(-15px) rotate(-4deg); } }
        @keyframes floatPhoto2 { 0% { transform: translateY(0px) rotate(6deg); } 100% { transform: translateY(-12px) rotate(10deg); } }
        @keyframes floatPhoto3 { 0% { transform: translateY(0px) rotate(-3deg); } 100% { transform: translateY(-14px) rotate(2deg); } }

        .final-content {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .paper-container.fade-out {
            opacity: 0;
            transform: translateY(-50px) scale(0.8);
            pointer-events: none;
        }

        /* --- THE CAT MINIGAME MODAL --- */
        .game-modal {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: rgba(255, 240, 245, 0.95);
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
            backdrop-filter: blur(5px);
        }

        .game-modal.active {
            opacity: 1;
            pointer-events: all;
        }

        .game-title {
            font-family: 'Nunito', sans-serif;
            font-size: 2.5rem;
            color: #ff4757;
            margin-top: 50px;
            font-weight: 900;
            text-shadow: 2px 2px 0 #fff;
            text-align: center;
        }

        .game-area {
            position: relative;
            width: 90vw;
            max-width: 400px;
            height: 60vh;
            background: #ffffff;
            border-radius: 20px;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.05), 0 15px 30px rgba(255, 107, 129, 0.2);
            margin-top: 20px;
            overflow: hidden;
            border: 4px dashed #ffb8b8;
        }

        /* New Cat styles for the picture version */
        .cat-entity {
            position: absolute;
            width: 70px;
            height: 70px;
            user-select: none;
            cursor: pointer;
            transition: top 0.4s ease-out, left 0.4s ease-out, transform 0.2s;
            -webkit-tap-highlight-color: transparent;
            z-index: 10;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .cat-image {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            pointer-events: none; /* So the click registers on the container */
            border: 3px solid #ffb8b8;
        }

        .cat-key {
            position: absolute;
            bottom: -5px;
            right: -10px;
            font-size: 35px;
            pointer-events: none;
            filter: drop-shadow(0px 2px 5px rgba(0,0,0,0.3));
        }

        /* Large key style when caught */
        .big-key {
            font-size: 60px;
            filter: drop-shadow(0px 10px 15px rgba(255, 107, 129, 0.4));
        }

    </style>
</head>
<body>

    <!-- Big White Mail Card -->
    <div class="mail-card" id="mailCard">
        <!-- Mail Notification inside the card -->
        <div class="mail-wrapper" id="mailBox">
            <svg class="mail-icon" viewBox="0 0 24 24">
                <path fill="currentColor" d="M20,8L12,13L4,8V6L12,11L20,6M20,4H4C2.89,4 2,4.89 2,6V18A2,2 0 0,0 4,20H20A2,2 0 0,0 22,18V6C22,4.89 21.1,4 20,4Z" />
            </svg>
            <div class="badge" id="badge">0</div>
        </div>
    </div>

    <!-- Identity Check Paper -->
    <div class="paper-container" id="paper">
        <h2 class="paper-title">Identity Check</h2>
        
        <div class="scanner-wrapper" id="scanner" oncontextmenu="return false;">
            <svg style="position:absolute; width:0; height:0;">
                <defs>
                    <radialGradient id="fadeGrad" cx="50%" cy="50%" r="50%">
                        <stop offset="60%" stop-color="white" stop-opacity="1"/>
                        <stop offset="100%" stop-color="white" stop-opacity="0"/>
                    </radialGradient>
                    <mask id="fadeMask">
                        <rect width="100" height="100" fill="url(#fadeGrad)"/>
                    </mask>
                </defs>
            </svg>
            <svg class="fingerprint base" viewBox="0 0 100 100" id="fingerprintBase" mask="url(#fadeMask)"></svg>
            <svg class="fingerprint fill" viewBox="0 0 100 100" id="fingerprintFill" mask="url(#fadeMask)"></svg>
        </div>
        
        <p class="status-text" id="statusText">Press and hold</p>
    </div>

    <!-- CHIYUKI Cute Text & Pictures -->
    <div class="chiyuki-wrapper" id="chiyukiWrap">
        <div class="final-content">
            <h1 class="bubble-text">CHIYUKI<br>🦐</h1>
            
            <div class="photo-gallery">
                <!-- Picture 1 (Clickable to start game) -->
                <div class="photo-frame frame-1" onclick="openGame()">
                    <img src="chiyuki.jpg" alt="Us 1" onerror="this.src='https://placehold.co/400x400/ffb8b8/ffffff?text=Pic+1'">
                </div>
                
                <!-- Picture 2 (LOCKED initially) -->
                <div class="photo-frame frame-2 locked" id="pic2">
                    <img src="chiyuki1.jpg" alt="Us 2" onerror="this.src='https://placehold.co/400x400/ffb8b8/ffffff?text=Pic+2'">
                </div>
                
                <!-- Picture 3 (LOCKED initially) -->
                <div class="photo-frame frame-3 locked" id="pic3">
                    <img src="chiyuki2.jpg" alt="Us 3" onerror="this.src='https://placehold.co/400x400/ffb8b8/ffffff?text=Pic+3'">
                </div>
            </div>
        </div>
    </div>

    <!-- The Minigame Popup for Picture 1 -->
    <div class="game-modal" id="gameModal">
        <h1 class="game-title">i love you naa ❤️</h1>
        <div class="game-area" id="gameArea">
            <div class="cat-entity" id="catEntity">
                <!-- Will be injected by JS to reset easily -->
            </div>
        </div>
    </div>

    <script>
        // --- 1. GENERATE FINGERPRINT ---
        const fingerprintPaths = [
            "M 50,45 v 20",
            "M 44,70 v -25 a 6,6 0 0,1 12,0 v 25",
            "M 38,72 v -27 a 12,12 0 0,1 24,0 v 27",
            "M 32,74 v -29 a 18,18 0 0,1 36,0 v 29",
            "M 26,76 v -31 a 24,24 0 0,1 48,0 v 31",
            "M 20,78 v -33 a 30,30 0 0,1 60,0 v 33",
            "M 14,80 v -35 a 36,36 0 0,1 72,0 v 35",
            "M 8,82 v -37 a 42,42 0 0,1 84,0 v 37",
            "M 44,75 v 15", "M 56,75 v 15",
            "M 38,77 v 15", "M 62,77 v 15",
            "M 32,79 v 15", "M 68,79 v 15",
            "M 26,81 v 15", "M 74,81 v 15",
            "M 50,70 v 20",
            "M 44,35 a 12,12 0 0,1 12,0",
            "M 38,30 a 18,18 0 0,1 24,0",
            "M 32,25 a 24,24 0 0,1 36,0",
            "M 26,20 a 30,30 0 0,1 48,0",
            "M 20,15 a 36,36 0 0,1 60,0"
        ];

        const baseSvg = document.getElementById('fingerprintBase');
        const fillSvg = document.getElementById('fingerprintFill');

        fingerprintPaths.forEach(d => {
            const pathBase = document.createElementNS("http://www.w3.org/2000/svg", "path");
            pathBase.setAttribute("d", d);
            baseSvg.appendChild(pathBase);

            const pathFill = document.createElementNS("http://www.w3.org/2000/svg", "path");
            pathFill.setAttribute("d", d);
            pathFill.setAttribute("pathLength", "1"); 
            fillSvg.appendChild(pathFill);
        });

        // --- 2. MAIL NOTIFICATION LOGIC ---
        const mailCard = document.getElementById('mailCard');
        const mailBox = document.getElementById('mailBox');
        const badge = document.getElementById('badge');
        const paper = document.getElementById('paper');
        
        let isMailReady = false;

        function handleMailClick(e) {
            if (!isMailReady) return;
            if(e) e.preventDefault(); 
            
            // Fade out the mail AND the white square
            mailBox.classList.add('opened');
            mailCard.classList.add('opened'); 
            
            setTimeout(() => {
                paper.classList.add('active');
            }, 300);
        }

        mailBox.addEventListener('click', handleMailClick);
        mailBox.addEventListener('touchstart', handleMailClick, { passive: false });
        
        const sequence = [
            { num: "1", wait: 1200 },
            { num: "3", wait: 800 },
            { num: "10", wait: 500 },
            { num: "24", wait: 300 },
            { num: "57", wait: 200 },
            { num: "89", wait: 100 },
            { num: "99+", wait: 0 }
        ];

        setTimeout(() => {
            badge.style.opacity = 1;
            badge.style.transform = 'scale(1)';
            
            let currentIndex = 0;

            function nextStep() {
                if (currentIndex >= sequence.length) return;
                const step = sequence[currentIndex];
                
                badge.innerText = step.num;
                badge.classList.remove('pop');
                void badge.offsetWidth;
                badge.classList.add('pop');

                currentIndex++;
                
                if (currentIndex < sequence.length) {
                    setTimeout(nextStep, step.wait);
                } else {
                    isMailReady = true;
                    mailBox.classList.add('ready');
                }
            }
            nextStep();
        }, 2000);

        // --- 3. SCANNER LOGIC ---
        const scanner = document.getElementById('scanner');
        const fingerprintFill = document.getElementById('fingerprintFill');
        const statusText = document.getElementById('statusText');
        const chiyukiWrap = document.getElementById('chiyukiWrap');
        
        let scanTimer;
        let isScanning = false;
        let scanCompleted = false;

        function startScan(e) {
            if(e && e.cancelable) e.preventDefault();
            if (scanCompleted) return;

            isScanning = true;
            scanner.classList.add('holding');
            fingerprintFill.classList.add('scanning');
            statusText.innerText = "Scanning biometrics...";
            statusText.style.color = "#ff4757";
            
            scanTimer = setTimeout(() => {
                scanCompleted = true;
                statusText.innerText = "Identity Verified! ❤️";
                statusText.style.color = "#2ed573";
                
                fingerprintFill.classList.remove('scanning');
                fingerprintFill.classList.add('verified');
                scanner.classList.remove('holding');
                
                setTimeout(() => {
                    paper.classList.add('fade-out');
                    chiyukiWrap.classList.add('show');
                }, 1000);
            }, 3000);
        }

        function stopScan(e) {
            if(e && e.cancelable) e.preventDefault();
            if (!isScanning || scanCompleted) return;
            
            isScanning = false;
            clearTimeout(scanTimer);
            
            scanner.classList.remove('holding');
            fingerprintFill.classList.remove('scanning');
            statusText.innerText = "Press and hold";
            statusText.style.color = "#747d8c";
        }

        scanner.addEventListener('mousedown', startScan);
        window.addEventListener('mouseup', stopScan);
        window.addEventListener('mouseleave', stopScan);
        scanner.addEventListener('touchstart', startScan, { passive: false });
        window.addEventListener('touchend', stopScan, { passive: false });
        window.addEventListener('touchcancel', stopScan, { passive: false });
        scanner.addEventListener('contextmenu', (e) => { e.preventDefault(); return false; });


        // --- 4. CAT MINIGAME LOGIC ---
        const gameModal = document.getElementById('gameModal');
        const catEntity = document.getElementById('catEntity');
        const gameArea = document.getElementById('gameArea');
        const pic2 = document.getElementById('pic2');
        
        let catInterval;
        let isCatCaught = false;

        function openGame() {
            // Only open if the cat hasn't been caught yet
            if (isCatCaught) return; 
            
            gameModal.classList.add('active');
            
            // Set up the cat image with the key overlay
            catEntity.innerHTML = `
                <img src="cat.jpg" class="cat-image" alt="cat" onerror="this.src='https://placehold.co/80x80/ffb8b8/ffffff?text=Cat'">
                <div class="cat-key">🔑</div>
            `;
            catEntity.style.transform = "scale(1)";
            isCatCaught = false;
            
            // Move the cat randomly every 600ms
            const moveCat = () => {
                if(isCatCaught) return;
                
                // Subtract 70px so the cat doesn't run outside the borders
                const maxX = gameArea.clientWidth - 70; 
                const maxY = gameArea.clientHeight - 70;
                
                catEntity.style.left = Math.max(10, Math.random() * maxX) + 'px';
                catEntity.style.top = Math.max(10, Math.random() * maxY) + 'px';
            };
            
            moveCat(); // Move instantly once
            catInterval = setInterval(moveCat, 600);
        }

        function catchCat(e) {
            if(e) e.preventDefault();
            if(isCatCaught) return;
            
            isCatCaught = true;
            clearInterval(catInterval); // Stop moving!
            
            // Turn into just the giant key
            catEntity.innerHTML = `<div class="big-key">🔑</div>`;
            catEntity.style.transform = "scale(1.5)";
            
            // Wait 1.5 seconds so they can see the key, then unlock Pic 2!
            setTimeout(() => {
                gameModal.classList.remove('active');
                pic2.classList.remove('locked'); // Unlocks Picture 2!
                
                // Add a little pop effect to show it unlocked
                pic2.style.animation = "popBadge 0.5s ease";
            }, 1500);
        }

        // Attach click/touch to the fast moving cat!
        catEntity.addEventListener('mousedown', catchCat);
        catEntity.addEventListener('touchstart', catchCat, { passive: false });

    </script>
</body>
</html>
