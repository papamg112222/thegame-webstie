<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>For My Love</title>
    <style>
        /* Background Gradient Animation */
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            width: 100vw;
            background: linear-gradient(-45deg, #fff0f5, #ffffff, #ffe4e1, #fff5f8);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* BIG WHITE SQUARE (The Mail Card Mask) */
        .mail-card {
            position: absolute;
            width: 280px;
            height: 280px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 40px;
            box-shadow: 0 25px 50px rgba(255, 107, 129, 0.15), inset 0 0 0 2px rgba(255, 255, 255, 1);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 5;
            transition: all 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .mail-card.opened {
            opacity: 0;
            transform: scale(0.5) translateY(150px);
            pointer-events: none;
        }

        /* Mail Container */
        .mail-wrapper {
            position: relative;
            width: 130px;
            height: 130px;
            z-index: 10;
            filter: drop-shadow(0px 10px 15px rgba(255, 107, 129, 0.3));
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            -webkit-tap-highlight-color: transparent;
        }
        
        .mail-wrapper.ready {
            cursor: pointer;
            animation: pulseMail 1.5s infinite alternate;
        }

        @keyframes pulseMail {
            0% { transform: scale(1); filter: drop-shadow(0px 10px 15px rgba(255, 107, 129, 0.4)); }
            100% { transform: scale(1.1); filter: drop-shadow(0px 15px 25px rgba(255, 107, 129, 0.7)); }
        }

        .mail-wrapper.opened {
            opacity: 0;
            transform: scale(0);
            pointer-events: none;
        }

        .mail-icon {
            width: 100%;
            height: 100%;
            color: #ff6b81; 
        }

        /* Notification Badge */
        .badge {
            position: absolute;
            top: -5px;
            right: -10px;
            background-color: #ff4757;
            color: white;
            font-size: 22px;
            font-weight: 800;
            padding: 4px 14px;
            border-radius: 20px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            border: 3px solid #fff;
            opacity: 0;
            transform: scale(0);
            transition: opacity 0.3s, transform 0.3s;
        }

        .pop {
            animation: popBadge 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popBadge {
            0% { transform: scale(1); }
            50% { transform: scale(1.3); }
            100% { transform: scale(1); }
        }

        /* Identity Check Paper */
        .paper-container {
            position: absolute;
            width: 320px;
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.15);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            box-sizing: border-box;
            opacity: 0;
            pointer-events: none;
            transform: translateY(50px) scale(0.8);
            transition: all 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            z-index: 20;
        }

        .paper-container.active {
            opacity: 1;
            pointer-events: all;
            transform: translateY(0) scale(1);
        }

        .paper-title {
            color: #2f3542;
            font-size: 1.6rem;
            letter-spacing: 2px;
            margin: 0 0 30px 0;
            text-transform: uppercase;
            font-weight: 900;
            border-bottom: 2px dashed #ced6e0;
            padding-bottom: 10px;
            width: 100%;
            text-align: center;
        }

        /* Scanner Area - Fixed and Clean */
        .scanner-wrapper {
            position: relative;
            width: 150px;
            height: 150px;
            cursor: pointer;
            border-radius: 50%;
            background: #f1f2f6;
            padding: 20px;
            box-shadow: inset 0 4px 10px rgba(0,0,0,0.08);
            transition: transform 0.2s, box-shadow 0.2s;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            touch-action: none; 
            -webkit-tap-highlight-color: transparent;
        }

        .scanner-wrapper:active, .scanner-wrapper.holding {
            transform: scale(0.92);
            box-shadow: inset 0 8px 20px rgba(0,0,0,0.12);
        }

        .fingerprint {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 90px;
            height: 90px;
        }

        .fingerprint path {
            fill: none;
            stroke-width: 3.5;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        
        .fingerprint.base path { stroke: #dfe4ea; }
        .fingerprint.fill path {
            stroke: #ff4757;
            stroke-dasharray: 1;
            stroke-dashoffset: 1;
            transition: stroke-dashoffset 0.4s ease-out; 
        }

        .fingerprint.fill.scanning path { stroke-dashoffset: 0 !important; }

        /* Randomize trace speeds for the geometric paths */
        .fingerprint.fill.scanning path:nth-child(1n) { transition: stroke-dashoffset 2.8s ease-in-out 0.1s; }
        .fingerprint.fill.scanning path:nth-child(2n) { transition: stroke-dashoffset 2.4s ease-in-out 0.2s; }
        .fingerprint.fill.scanning path:nth-child(3n) { transition: stroke-dashoffset 2.9s ease-in-out 0.0s; }
        .fingerprint.fill.scanning path:nth-child(4n) { transition: stroke-dashoffset 2.5s ease-in-out 0.3s; }
        .fingerprint.fill.scanning path:nth-child(5n) { transition: stroke-dashoffset 3.0s ease-in-out 0.1s; }

        .fingerprint.fill.verified path {
            stroke-dashoffset: 0 !important;
            transition: none !important;
        }

        .status-text {
            margin-top: 30px;
            color: #747d8c;
            font-size: 1.2rem;
            font-weight: 600;
            height: 24px;
            transition: color 0.3s;
        }

        /* CHIYUKI Bubble Text Wrapper */
        .chiyuki-wrapper {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transform: scale(0.5);
            transition: all 1.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 50;
        }

        .chiyuki-wrapper.show {
            opacity: 1;
            transform: scale(1);
            pointer-events: all;
        }

        /* Bigger text as requested */
        .bubble-text {
            font-family: 'Nunito', 'Arial Rounded MT Bold', 'Comic Sans MS', sans-serif;
            font-size: 6rem; /* Much larger */
            font-weight: 900;
            color: #ff6b81;
            letter-spacing: 3px;
            margin: 0;
            text-align: center;
            text-shadow: 
                -4px -4px 0 #fff, 4px -4px 0 #fff, -4px 4px 0 #fff, 4px 4px 0 #fff,
                -8px -8px 0 #ffe4e1, 8px -8px 0 #ffe4e1, -8px 8px 0 #ffe4e1, 8px 8px 0 #ffe4e1,
                0px 20px 30px rgba(255, 107, 129, 0.4);
            animation: floatBubble 2.5s ease-in-out infinite alternate;
        }

        @keyframes floatBubble {
            0% { transform: translateY(0px) rotate(-3deg) scale(1); }
            100% { transform: translateY(-20px) rotate(3deg) scale(1.05); }
        }

        /* Photo Gallery Layout */
        .photo-gallery {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            margin-top: 40px;
            max-width: 95vw;
        }

        /* Bigger Polaroid Photo Frame */
        .photo-frame {
            position: relative;
            width: 160px; /* Increased size */
            height: 160px; /* Increased size */
            background: white;
            padding: 12px;
            padding-bottom: 40px;
            border-radius: 8px;
            box-shadow: 0 15px 35px rgba(255, 107, 129, 0.4), inset 0 0 0 1px rgba(0,0,0,0.05);
            cursor: pointer;
            transition: transform 0.3s, filter 0.5s;
            -webkit-tap-highlight-color: transparent;
        }

        .photo-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 4px;
            background-color: #f1f2f6;
        }

        .photo-frame.locked {
            filter: grayscale(100%) brightness(0.6);
            cursor: not-allowed;
        }
        
        .photo-frame.locked::after {
            content: "🔒";
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 4rem;
            filter: drop-shadow(0px 4px 6px rgba(0,0,0,0.4));
        }

        .frame-1 { animation: floatPhoto1 3.5s ease-in-out infinite alternate 0.1s; }
        .frame-2 { animation: floatPhoto2 3.1s ease-in-out infinite alternate 0.4s; }
        .frame-3 { animation: floatPhoto3 3.3s ease-in-out infinite alternate 0.7s; }

        @keyframes floatPhoto1 { 0% { transform: translateY(0px) rotate(-8deg); } 100% { transform: translateY(-15px) rotate(-4deg); } }
        @keyframes floatPhoto2 { 0% { transform: translateY(0px) rotate(6deg); } 100% { transform: translateY(-12px) rotate(10deg); } }
        @keyframes floatPhoto3 { 0% { transform: translateY(0px) rotate(-3deg); } 100% { transform: translateY(-14px) rotate(2deg); } }

        .final-content {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .paper-container.fade-out {
            opacity: 0;
            transform: translateY(-50px) scale(0.8);
            pointer-events: none;
        }

        /* --- MINIGAME MODALS --- */
        .game-modal {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: rgba(255, 240, 245, 0.95);
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
            backdrop-filter: blur(5px);
        }

        .game-modal.active {
            opacity: 1;
            pointer-events: all;
        }

        /* Game 1: Cat */
        .game-area {
            position: relative;
            width: 90vw;
            max-width: 400px;
            height: 60vh;
            background: #ffffff;
            border-radius: 20px;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.05), 0 15px 30px rgba(255, 107, 129, 0.2);
            overflow: hidden;
            border: 4px dashed #ffb8b8;
        }

        .cat-entity {
            position: absolute;
            width: 80px;
            height: 80px;
            user-select: none;
            cursor: pointer;
            transition: top 0.4s ease-out, left 0.4s ease-out, transform 0.2s;
            -webkit-tap-highlight-color: transparent;
            z-index: 10;
        }

        .cat-image {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            pointer-events: none; 
            border: 3px solid #ffb8b8;
        }

        .cat-key {
            position: absolute;
            bottom: 0px;
            right: -10px;
            font-size: 35px;
            pointer-events: none;
            filter: drop-shadow(0px 2px 5px rgba(0,0,0,0.3));
        }

        .big-key {
            font-size: 70px;
            filter: drop-shadow(0px 10px 15px rgba(255, 107, 129, 0.4));
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
        }

        /* Game 2: Typing Test */
        .type-box {
            background: #ffffff;
            border-radius: 20px;
            padding: 40px 20px;
            text-align: center;
            box-shadow: 0 15px 30px rgba(255, 107, 129, 0.2);
            border: 4px dashed #ffb8b8;
            width: 90vw; max-width: 400px;
        }
        
        .type-box h2 { color: #ff4757; font-size: 2rem; margin-top: 0;}
        .target-text { font-size: 2rem; font-weight: 900; color: #2f3542; margin: 20px 0; letter-spacing: 1px; }
        #typeInput {
            font-size: 1.5rem; padding: 15px; border: 3px solid #ffb8b8; border-radius: 15px;
            text-align: center; width: 80%; outline: none; margin-bottom: 20px;
            font-family: inherit;
        }
        #wpmResult { font-size: 1.2rem; font-weight: bold; height: 30px; }

        /* Game 3: Proposal */
        .proposal-box {
            background: #dfe4ea; /* Grey square */
            border-radius: 20px;
            padding: 50px 30px;
            text-align: center;
            box-shadow: 0 15px 40px rgba(0,0,0,0.2);
            max-width: 90vw;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        #proposalTitle {
            color: #2f3542;
            font-size: 2.2rem;
            margin-bottom: 40px;
            font-weight: 900;
            transition: all 0.3s ease;
        }

        .proposal-buttons {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            height: 80px; /* Keep height stable as buttons shrink */
        }

        .btn-yes {
            background: #ff6b81; /* Pink oval */
            color: white;
            padding: 15px 40px;
            border-radius: 50px;
            font-size: 1.5rem;
            font-weight: 900;
            border: none;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 107, 129, 0.4);
            transition: transform 0.1s;
        }
        .btn-yes:active { transform: scale(0.9); }

        .btn-no {
            background: #747d8c; /* Grey oval */
            color: white;
            padding: 15px 30px;
            border-radius: 50px;
            font-size: 1.2rem;
            font-weight: bold;
            border: none;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            white-space: nowrap;
        }

        /* Confetti Animation */
        .confetti-particle {
            position: fixed;
            width: 15px;
            height: 15px;
            border-radius: 50%;
            pointer-events: none;
            z-index: 9999;
            opacity: 0;
            animation: boom 1.5s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
        }

        @keyframes boom {
            0% { transform: translate(0, 0) scale(1) rotate(0deg); opacity: 1; }
            100% { transform: translate(var(--tx), var(--ty)) scale(0) rotate(720deg); opacity: 0; }
        }

    </style>
</head>
<body>

    <!-- Big White Mail Card -->
    <div class="mail-card" id="mailCard">
        <div class="mail-wrapper" id="mailBox">
            <svg class="mail-icon" viewBox="0 0 24 24">
                <path fill="currentColor" d="M20,8L12,13L4,8V6L12,11L20,6M20,4H4C2.89,4 2,4.89 2,6V18A2,2 0 0,0 4,20H20A2,2 0 0,0 22,18V6C22,4.89 21.1,4 20,4Z" />
            </svg>
            <div class="badge" id="badge">0</div>
        </div>
    </div>

    <!-- Identity Check Paper -->
    <div class="paper-container" id="paper">
        <h2 class="paper-title">Identity Check</h2>
        
        <div class="scanner-wrapper" id="scanner" oncontextmenu="return false;">
            <svg style="position:absolute; width:0; height:0;">
                <defs>
                    <radialGradient id="fadeGrad" cx="50%" cy="50%" r="50%">
                        <stop offset="65%" stop-color="white" stop-opacity="1"/>
                        <stop offset="100%" stop-color="white" stop-opacity="0"/>
                    </radialGradient>
                    <mask id="fadeMask">
                        <rect width="100" height="100" fill="url(#fadeGrad)"/>
                    </mask>
                </defs>
            </svg>
            <svg class="fingerprint base" viewBox="0 0 100 100" id="fingerprintBase" mask="url(#fadeMask)"></svg>
            <svg class="fingerprint fill" viewBox="0 0 100 100" id="fingerprintFill" mask="url(#fadeMask)"></svg>
        </div>
        
        <p class="status-text" id="statusText">Press and hold</p>
    </div>

    <!-- CHIYUKI Cute Text & Pictures -->
    <div class="chiyuki-wrapper" id="chiyukiWrap">
        <div class="final-content">
            <h1 class="bubble-text">CHIYUKI<br>🦐</h1>
            
            <div class="photo-gallery">
                <!-- Picture 1 (Cat Game) -->
                <div class="photo-frame frame-1" id="pic1">
                    <img src="chiyuki.jpg" alt="Us 1" onerror="this.src='https://placehold.co/400x400/ffb8b8/ffffff?text=Pic+1'">
                </div>
                
                <!-- Picture 2 (Typing Test) -->
                <div class="photo-frame frame-2 locked" id="pic2">
                    <img src="chiyuki1.jpg" alt="Us 2" onerror="this.src='https://placehold.co/400x400/ffb8b8/ffffff?text=Pic+2'">
                </div>
                
                <!-- Picture 3 (Proposal) -->
                <div class="photo-frame frame-3 locked" id="pic3">
                    <img src="chiyuki2.jpg" alt="Us 3" onerror="this.src='https://placehold.co/400x400/ffb8b8/ffffff?text=Pic+3'">
                </div>
            </div>
        </div>
    </div>

    <!-- Modal 1: Cat Minigame -->
    <div class="game-modal" id="catModal">
        <div class="game-area" id="gameArea">
            <div class="cat-entity" id="catEntity">
                <!-- Javascript will put cat.jpg here -->
            </div>
        </div>
    </div>

    <!-- Modal 2: Typing Test -->
    <div class="game-modal" id="typingModal">
        <div class="type-box">
            <h2>Typing Test</h2>
            <p style="color: #747d8c; margin-bottom: 0;">Type this to prove your love:</p>
            <div class="target-text">i love you naa</div>
            <input type="text" id="typeInput" placeholder="Start typing..." autocomplete="off">
            <div id="wpmResult"></div>
        </div>
    </div>

    <!-- Modal 3: Proposal -->
    <div class="game-modal" id="proposalModal">
        <div class="proposal-box">
            <h1 id="proposalTitle">Will you be a Girlfriend?</h1>
            <div class="proposal-buttons">
                <button id="btnYes" class="btn-yes">YES!!!</button>
                <button id="btnNo" class="btn-no">No</button>
            </div>
        </div>
    </div>

    <script>
        // --- 1. CLEAN GEOMETRIC FINGERPRINT GENERATION ---
        const fingerprintPaths = [
            "M50,20 A30,30 0 0,0 20,50 v15", "M50,20 A30,30 0 0,1 80,50 v15",
            "M50,28 A22,22 0 0,0 28,50 v20", "M50,28 A22,22 0 0,1 72,50 v20",
            "M50,36 A14,14 0 0,0 36,50 v10", "M50,36 A14,14 0 0,1 64,50 v10",
            "M50,44 A6,6 0 0,0 44,50 v25",   "M50,44 A6,6 0 0,1 56,50 v25",
            "M50,50 v30",
            "M35,65 A15,15 0 0,1 65,65", "M30,72 A20,20 0 0,1 70,72", "M25,79 A25,25 0 0,1 75,79",
            "M35,65 v10", "M65,65 v10", "M30,72 v8", "M70,72 v8", "M25,79 v5", "M75,79 v5"
        ];

        const baseSvg = document.getElementById('fingerprintBase');
        const fillSvg = document.getElementById('fingerprintFill');

        fingerprintPaths.forEach(d => {
            const pathBase = document.createElementNS("http://www.w3.org/2000/svg", "path");
            pathBase.setAttribute("d", d);
            baseSvg.appendChild(pathBase);

            const pathFill = document.createElementNS("http://www.w3.org/2000/svg", "path");
            pathFill.setAttribute("d", d);
            pathFill.setAttribute("pathLength", "1"); // Magic trick for smooth tracing
            fillSvg.appendChild(pathFill);
        });

        // --- 2. MAIL NOTIFICATION SEQUENCE ---
        const mailCard = document.getElementById('mailCard');
        const mailBox = document.getElementById('mailBox');
        const badge = document.getElementById('badge');
        const paper = document.getElementById('paper');
        let isMailReady = false;

        const sequence = [
            { num: "1", wait: 1200 }, { num: "3", wait: 800 },
            { num: "10", wait: 500 }, { num: "24", wait: 300 },
            { num: "57", wait: 200 }, { num: "89", wait: 100 },
            { num: "99+", wait: 0 }
        ];

        setTimeout(() => {
            badge.style.opacity = 1;
            badge.style.transform = 'scale(1)';
            let currentIndex = 0;

            function nextStep() {
                if (currentIndex >= sequence.length) return;
                const step = sequence[currentIndex];
                badge.innerText = step.num;
                badge.classList.remove('pop');
                void badge.offsetWidth;
                badge.classList.add('pop');
                currentIndex++;
                
                if (currentIndex < sequence.length) {
                    setTimeout(nextStep, step.wait);
                } else {
                    isMailReady = true;
                    mailBox.classList.add('ready');
                }
            }
            nextStep();
        }, 2000);

        mailBox.addEventListener('click', (e) => {
            if (!isMailReady) return;
            mailBox.classList.add('opened');
            mailCard.classList.add('opened'); 
            setTimeout(() => paper.classList.add('active'), 300);
        });
        mailBox.addEventListener('touchstart', (e) => { if(isMailReady) e.preventDefault(); mailBox.click(); }, { passive: false });

        // --- 3. 3-SECOND FINGERPRINT SCANNER ---
        const scanner = document.getElementById('scanner');
        const fingerprintFill = document.getElementById('fingerprintFill');
        const statusText = document.getElementById('statusText');
        const chiyukiWrap = document.getElementById('chiyukiWrap');
        let scanTimer;
        let isScanning = false, scanCompleted = false;

        function startScan(e) {
            if(e && e.cancelable) e.preventDefault();
            if (scanCompleted) return;
            isScanning = true;
            scanner.classList.add('holding');
            fingerprintFill.classList.add('scanning');
            statusText.innerText = "Scanning biometrics...";
            statusText.style.color = "#ff4757";
            
            scanTimer = setTimeout(() => {
                scanCompleted = true;
                statusText.innerText = "Identity Verified! ❤️";
                statusText.style.color = "#2ed573";
                fingerprintFill.classList.remove('scanning');
                fingerprintFill.classList.add('verified');
                scanner.classList.remove('holding');
                
                setTimeout(() => {
                    paper.classList.add('fade-out');
                    chiyukiWrap.classList.add('show');
                }, 1000);
            }, 3000); // 3 Seconds exact
        }

        function stopScan(e) {
            if(e && e.cancelable) e.preventDefault();
            if (!isScanning || scanCompleted) return;
            isScanning = false;
            clearTimeout(scanTimer);
            scanner.classList.remove('holding');
            fingerprintFill.classList.remove('scanning');
            statusText.innerText = "Press and hold";
            statusText.style.color = "#747d8c";
        }

        scanner.addEventListener('mousedown', startScan);
        window.addEventListener('mouseup', stopScan);
        window.addEventListener('mouseleave', stopScan);
        scanner.addEventListener('touchstart', startScan, { passive: false });
        window.addEventListener('touchend', stopScan, { passive: false });
        window.addEventListener('touchcancel', stopScan, { passive: false });


        // --- 4. GAME 1: CAT MINIGAME ---
        const pic1 = document.getElementById('pic1');
        const pic2 = document.getElementById('pic2');
        const catModal = document.getElementById('catModal');
        const catEntity = document.getElementById('catEntity');
        const gameArea = document.getElementById('gameArea');
        let catInterval;
        let isCatCaught = false;

        pic1.addEventListener('click', () => {
            if (isCatCaught) return;
            catModal.classList.add('active');
            catEntity.innerHTML = `
                <img src="cat.jpg" class="cat-image" alt="cat" onerror="this.src='https://placehold.co/80x80/ffb8b8/ffffff?text=Cat'">
                <div class="cat-key">🔑</div>
            `;
            const moveCat = () => {
                if(isCatCaught) return;
                const maxX = gameArea.clientWidth - 80; 
                const maxY = gameArea.clientHeight - 80;
                catEntity.style.left = Math.max(10, Math.random() * maxX) + 'px';
                catEntity.style.top = Math.max(10, Math.random() * maxY) + 'px';
            };
            moveCat();
            catInterval = setInterval(moveCat, 500); // Runs fast
        });

        function catchCat(e) {
            if(e) e.preventDefault();
            if(isCatCaught) return;
            isCatCaught = true;
            clearInterval(catInterval);
            catEntity.innerHTML = `<div class="big-key">🔑</div>`;
            
            setTimeout(() => {
                catModal.classList.remove('active');
                pic2.classList.remove('locked'); 
                pic2.style.animation = "popBadge 0.5s ease";
            }, 1500);
        }
        catEntity.addEventListener('mousedown', catchCat);
        catEntity.addEventListener('touchstart', catchCat, { passive: false });

        // --- 5. GAME 2: TYPING TEST ---
        const typingModal = document.getElementById('typingModal');
        const typeInput = document.getElementById('typeInput');
        const wpmResult = document.getElementById('wpmResult');
        const pic3 = document.getElementById('pic3');
        const targetStr = "i love you naa";
        let typeStartTime = null;

        pic2.addEventListener('click', () => {
            if (pic2.classList.contains('locked') || isCatCaught === false) return;
            typingModal.classList.add('active');
            typeInput.value = "";
            wpmResult.innerHTML = "";
            typeStartTime = null;
            setTimeout(() => typeInput.focus(), 100);
        });

        typeInput.addEventListener('input', () => {
            if (!typeStartTime) typeStartTime = new Date().getTime();
            
            if (typeInput.value.toLowerCase() === targetStr) {
                const timeTaken = (new Date().getTime() - typeStartTime) / 1000;
                const wpm = Math.round((4 / (timeTaken / 60))); // 4 words
                
                if (wpm >= 10) {
                    wpmResult.innerHTML = `<span style="color:#2ed573">Success! ${wpm} WPM</span>`;
                    setTimeout(() => {
                        typingModal.classList.remove('active');
                        pic3.classList.remove('locked');
                        pic3.style.animation = "popBadge 0.5s ease";
                    }, 1200);
                } else {
                    wpmResult.innerHTML = `<span style="color:#ff4757">Too slow! ${wpm} WPM. Try again.</span>`;
                    typeInput.value = "";
                    typeStartTime = null;
                }
            }
        });

        // --- 6. GAME 3: THE PROPOSAL & BOOM SURPRISE ---
        const proposalModal = document.getElementById('proposalModal');
        const btnYes = document.getElementById('btnYes');
        const btnNo = document.getElementById('btnNo');
        const proposalTitle = document.getElementById('proposalTitle');

        const noPhrases = [
            "Are you sure?", "Think again!", "Really sure?", "Don't do this!", "Have a heart!", 
            "I'll be sad...", "Please?", "I'm begging you!", "Just say yes!", "Breaking my heart!", 
            "Give it a chance!", "Final answer?", "Reconsider?", "I love you though!", 
            "Why not?", "It'll be fun!", "I promise to be good!", "Don't click this!", 
            "Last chance!", "Fine, I'm gone..."
        ];
        let noCount = 0;

        pic3.addEventListener('click', () => {
            if (pic3.classList.contains('locked')) return;
            proposalModal.classList.add('active');
        });

        btnNo.addEventListener('click', () => {
            if (noCount < noPhrases.length) {
                btnNo.innerText = noPhrases[noCount];
                // Shrink the button down slightly each time
                const scale = 1 - (noCount * 0.04);
                btnNo.style.transform = `scale(${scale})`;
                noCount++;
            } else {
                btnNo.style.display = 'none'; // Vanish completely
            }
        });

        // The Celebration! Boom from below!
        btnYes.addEventListener('click', () => {
            proposalTitle.innerText = "yay!! 🎉❤️";
            proposalTitle.style.color = "#ff4757";
            proposalTitle.style.fontSize = "3.5rem";
            btnYes.style.display = 'none';
            btnNo.style.display = 'none';
            shootConfetti();
        });

        function shootConfetti() {
            for (let i = 0; i < 120; i++) {
                let conf = document.createElement('div');
                conf.className = 'confetti-particle';
                document.body.appendChild(conf);
                
                // Shoot upwards in an arc
                let angle = (Math.random() * (Math.PI * 0.6)) + (Math.PI * 0.2); 
                let velocity = 15 + Math.random() * 35;
                
                let tx = Math.cos(angle) * velocity * 15 + 'px';
                let ty = -Math.sin(angle) * velocity * 15 - (Math.random() * 300) + 'px'; // Move up highly negative
                
                conf.style.setProperty('--tx', tx);
                conf.style.setProperty('--ty', ty);
                
                // Start from center bottom
                conf.style.left = '50%';
                conf.style.bottom = '-20px'; 
                
                // Random cute colors
                let colors = ['#ff4757', '#ff6b81', '#ffffff', '#ffd32a', '#ff9ff3'];
                conf.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                
                // Add tiny delays so it shoots like a continuous burst
                conf.style.animationDelay = (Math.random() * 0.3) + 's';
                
                // Clean up memory
                setTimeout(() => conf.remove(), 2500);
            }
        }

    </script>
</body>
</html>
