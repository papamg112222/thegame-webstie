<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>3D Multiplayer Tag - Next-Gen Parkour</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #0c0c14;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            touch-action: none;
        }
        #game-canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding-top: 25px;
        }
        #status-box {
            background: rgba(15, 15, 25, 0.85);
            color: #ffffff;
            padding: 14px 35px;
            border-radius: 35px;
            font-size: 22px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2.5px;
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.5);
            transition: all 0.3s ease;
        }
        .is-it { background: rgba(235, 40, 40, 0.9) !important; border-color: rgba(255, 100, 100, 0.5) !important; animation: pulse 0.8s infinite alternate; }
        .is-safe { background: rgba(30, 140, 255, 0.9) !important; border-color: rgba(100, 180, 255, 0.5) !important; }
        
        @keyframes pulse {
            from { transform: scale(1); box-shadow: 0 0 15px rgba(255,0,0,0.6); }
            to { transform: scale(1.06); box-shadow: 0 0 30px rgba(255,0,0,0.95); }
        }

        #joystick-zone {
            position: absolute;
            bottom: 35px;
            left: 35px;
            width: 130px;
            height: 130px;
            background: rgba(255, 255, 255, 0.12);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            pointer-events: auto;
            display: none;
            backdrop-filter: blur(4px);
        }
        #joystick-knob {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 55px;
            height: 55px;
            background: rgba(255, 255, 255, 0.85);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }

        #action-buttons {
            position: absolute;
            bottom: 35px;
            right: 35px;
            display: flex;
            gap: 16px;
            pointer-events: auto;
        }
        .action-btn {
            width: 70px;
            height: 70px;
            background: rgba(255, 255, 255, 0.15);
            border: 2px solid rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            color: white;
            font-size: 17px;
            font-weight: 800;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 6px 20px rgba(0,0,0,0.4);
            user-select: none;
            cursor: pointer;
            backdrop-filter: blur(6px);
            transition: transform 0.1s, background 0.1s;
        }
        .action-btn:active {
            transform: scale(0.88);
            background: rgba(255, 255, 255, 0.35);
        }
        #btn-jump { background: rgba(30, 180, 255, 0.35); border-color: rgba(100, 200, 255, 0.7); }
        #btn-a { background: rgba(255, 130, 30, 0.35); border-color: rgba(255, 180, 100, 0.7); }
        #btn-b { background: rgba(40, 230, 100, 0.35); border-color: rgba(100, 255, 150, 0.7); }
        
        @media (hover: none) and (pointer: coarse) {
            #joystick-zone { display: block; }
        }
    </style>
    
    <script src="https://unpkg.com/mqtt@4.3.7/dist/mqtt.min.js"></script>
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.150.1/build/three.module.js"
            }
        }
    </script>
</head>
<body>

    <div id="ui-layer">
        <div id="status-box">Connecting to EMQX Broker...</div>
    </div>
    
    <div id="joystick-zone">
        <div id="joystick-knob"></div>
    </div>

    <div id="action-buttons">
        <div class="action-btn" id="btn-jump">JUMP</div>
        <div class="action-btn" id="btn-a">A</div>
        <div class="action-btn" id="btn-b">B</div>
    </div>

    <script type="module">
        import * as THREE from 'three';

        // ==========================================
        // 1. EMQX MQTT WEBSOCKET SETUP
        // ==========================================
        const clientId = 'tag_player_' + Math.random().toString(16).substr(2, 8);
        const mqttClient = mqtt.connect('wss://broker.emqx.io:8084/mqtt', {
            clientId: clientId,
            clean: true,
            connectTimeout: 4000,
        });

        const TOPIC_POSITIONS = 'taggame/room2/positions';
        const TOPIC_STATE = 'taggame/room2/gamestate';

        let isGameReady = false;
        let currentItId = null;
        let tagCooldown = 0;
        const TAG_DISTANCE = 3.5;
        const SYNC_RATE_MS = 100;

        const remotePlayersData = {}; 
        const remotePlayerMeshes = {};

        mqttClient.on('connect', () => {
            console.log('Connected to EMQX Broker!');
            document.getElementById('status-box').innerText = "Connected! Initializing Arena...";
            
            mqttClient.subscribe(TOPIC_POSITIONS, { qos: 0 });
            mqttClient.subscribe(TOPIC_STATE, { qos: 1 });

            initGame();
            startNetworkLoop();
        });

        mqttClient.on('error', (err) => {
            console.error('MQTT Connection error: ', err);
            document.getElementById('status-box').innerText = "Broker Connection Failed.";
        });

        mqttClient.on('message', (topic, payload) => {
            if (!isGameReady) return;
            const data = JSON.parse(payload.toString());

            if (topic === TOPIC_POSITIONS) {
                if (data.id === clientId) return;

                const now = Date.now();
                if (!remotePlayerMeshes[data.id]) {
                    const mesh = createNextGenHumanoidMesh();
                    mesh.position.set(data.x, data.y || 0, data.z);
                    scene.add(mesh);
                    remotePlayerMeshes[data.id] = mesh;
                    remotePlayersData[data.id] = { targetX: data.x, targetY: data.y || 0, targetZ: data.z, lastUpdate: now, animState: 'idle' };
                } else {
                    remotePlayersData[data.id].targetX = data.x;
                    remotePlayersData[data.id].targetY = data.y || 0;
                    remotePlayersData[data.id].targetZ = data.z;
                    remotePlayersData[data.id].lastUpdate = now;
                    remotePlayersData[data.id].animState = data.animState || 'idle';
                }
            } else if (topic === TOPIC_STATE) {
                updateItStatus(data.currentIt);
            }
        });

        // ==========================================
        // 2. THREE.JS ENGINE SETUP & LIGHTING
        // ==========================================
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0a16);
        scene.fog = new THREE.FogExp2(0x0a0a16, 0.015);

        const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 1000);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        document.body.appendChild(renderer.domElement);
        renderer.domElement.id = 'game-canvas';

        // Advanced Cinematic Lighting
        const ambientLight = new THREE.AmbientLight(0x222233, 1.2);
        scene.add(ambientLight);

        const mainLight = new THREE.DirectionalLight(0x7090ff, 1.8);
        mainLight.position.set(40, 60, 30);
        mainLight.castShadow = true;
        mainLight.shadow.mapSize.width = 2048;
        mainLight.shadow.mapSize.height = 2048;
        mainLight.shadow.camera.near = 0.5;
        mainLight.shadow.camera.far = 150;
        const d = 50;
        mainLight.shadow.camera.left = -d;
        mainLight.shadow.camera.right = d;
        mainLight.shadow.camera.top = d;
        mainLight.shadow.camera.bottom = -d;
        scene.add(mainLight);

        const accentLight = new THREE.DirectionalLight(0xff5577, 1.0);
        accentLight.position.set(-40, 30, -30);
        scene.add(accentLight);

        // Environment (Cyberpunk Plaza Arena)
        const ARENA_SIZE = 120;
        const floorGeo = new THREE.PlaneGeometry(ARENA_SIZE, ARENA_SIZE, 64, 64);
        const floorMat = new THREE.MeshStandardMaterial({ 
            color: 0x11121d, 
            roughness: 0.25,
            metalness: 0.85
        });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        floor.receiveShadow = true;
        scene.add(floor);

        const gridHelper = new THREE.GridHelper(ARENA_SIZE, 60, 0x00f0ff, 0x1c1e33);
        gridHelper.position.y = 0.02; 
        scene.add(gridHelper);

        // --- MAP OBSTACLES & HEIGHT MAPPING ---
        const colliderBoxes = [];
        const vaultableBoxes = [];

        function createObstacle(w, h, d, x, z, material, isVaultable = false) {
            const geo = new THREE.BoxGeometry(w, h, d);
            const mesh = new THREE.Mesh(geo, material);
            mesh.position.set(x, h / 2, z);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            scene.add(mesh);
            
            mesh.updateMatrixWorld();
            const box = new THREE.Box3().setFromObject(mesh);
            colliderBoxes.push(box);

            if (isVaultable) {
                vaultableBoxes.push({ mesh, box, height: h, topY: h });
            }
            return mesh;
        }

        const matMonument = new THREE.MeshStandardMaterial({ color: 0x222538, roughness: 0.3, metalness: 0.7 });
        const matWallBlock = new THREE.MeshStandardMaterial({ color: 0x1b1d2e, roughness: 0.4, metalness: 0.6 });
        const matNeonBlue = new THREE.MeshStandardMaterial({ color: 0x00aaff, roughness: 0.2, emissive: 0x0055aa });
        const matNeonPink = new THREE.MeshStandardMaterial({ color: 0xff0055, roughness: 0.2, emissive: 0xaa0033 });

        // Center Monument
        createObstacle(12, 14, 12, 0, 0, matMonument);
        createObstacle(6, 18, 6, 0, 0, matNeonBlue);

        // Outer Perimeter Walls
        const offset = 45;
        const cornerSize = 20;
        const thick = 4;
        const height = 10;
        
        createObstacle(cornerSize, height, thick, -offset, -offset - cornerSize/2, matWallBlock);
        createObstacle(thick, height, cornerSize, -offset - cornerSize/2, -offset, matWallBlock);
        createObstacle(cornerSize, height, thick, offset, -offset - cornerSize/2, matWallBlock);
        createObstacle(thick, height, cornerSize, offset + cornerSize/2, -offset, matWallBlock);
        createObstacle(cornerSize, height, thick, -offset, offset + cornerSize/2, matWallBlock);
        createObstacle(thick, height, cornerSize, -offset - cornerSize/2, offset, matWallBlock);
        createObstacle(cornerSize, height, thick, offset, offset + cornerSize/2, matWallBlock);
        createObstacle(thick, height, cornerSize, offset + cornerSize/2, offset, matWallBlock);

        // Scattered Parkour Platforms & Obstacles
        for (let i = 0; i < 45; i++) {
            const x = (Math.random() - 0.5) * (ARENA_SIZE - 20);
            const z = (Math.random() - 0.5) * (ARENA_SIZE - 20);
            if (Math.abs(x) < 16 && Math.abs(z) < 16) continue;

            const w = Math.random() * 5 + 3;
            const h = Math.random() * 3.5 + 1.2; // Varied heights (some jumpable onto, some vaultable)
            const d = Math.random() * 5 + 3;
            const mat = Math.random() > 0.5 ? matNeonBlue : matNeonPink;
            createObstacle(w, h, d, x, z, mat, true);
        }

        // Invisible Bounds
        const invisibleMat = new THREE.MeshBasicMaterial({ visible: false });
        createObstacle(ARENA_SIZE + 2, 30, 2, 0, -ARENA_SIZE/2 - 1, invisibleMat);
        createObstacle(ARENA_SIZE + 2, 30, 2, 0, ARENA_SIZE/2 + 1, invisibleMat);
        createObstacle(2, 30, ARENA_SIZE + 2, -ARENA_SIZE/2 - 1, 0, invisibleMat);
        createObstacle(2, 30, ARENA_SIZE + 2, ARENA_SIZE/2 + 1, 0, invisibleMat);

        // Power-ups
        const powerUps = [];
        const powerUpGeo = new THREE.OctahedronGeometry(1.4, 0);
        const powerUpMat = new THREE.MeshStandardMaterial({ color: 0x00ffcc, emissive: 0x00ffaa, roughness: 0.1, metalness: 0.9 });

        for (let i = 0; i < 8; i++) {
            const mesh = new THREE.Mesh(powerUpGeo, powerUpMat);
            let rx = (Math.random() - 0.5) * (ARENA_SIZE - 25);
            let rz = (Math.random() - 0.5) * (ARENA_SIZE - 25);
            while(Math.abs(rx) < 15 && Math.abs(rz) < 15) {
                rx = (Math.random() - 0.5) * (ARENA_SIZE - 25);
                rz = (Math.random() - 0.5) * (ARENA_SIZE - 25);
            }
            mesh.position.set(rx, 2.0, rz);
            scene.add(mesh);
            powerUps.push(mesh);
        }

        // ==========================================
        // 3. NEXT-GEN HUMANOID CHARACTER RIG
        // ==========================================
        const matRunner = new THREE.MeshStandardMaterial({ color: 0x2563eb, roughness: 0.25, metalness: 0.5 });
        const matIt = new THREE.MeshStandardMaterial({ color: 0xdc2626, roughness: 0.25, metalness: 0.5, emissive: 0x7f1d1d });
        const matSkin = new THREE.MeshStandardMaterial({ color: 0xfde047, roughness: 0.4 }); // Sleek visor styling
        const matJoints = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.1, metalness: 0.9 });

        function createNextGenHumanoidMesh() {
            const container = new THREE.Group();
            const partsList = [];

            const hipCenter = new THREE.Group();
            hipCenter.position.y = 1.1;
            container.add(hipCenter);

            // Torso & Armor Plates
            const torsoGeo = new THREE.BoxGeometry(1.15, 1.35, 0.58);
            const torso = new THREE.Mesh(torsoGeo, matRunner);
            torso.position.y = 0.68;
            torso.castShadow = true;
            hipCenter.add(torso);
            partsList.push(torso);

            const neck = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.18, 0.28, 12), matJoints);
            neck.position.y = 1.48;
            torso.add(neck);

            const head = new THREE.Mesh(new THREE.BoxGeometry(0.68, 0.68, 0.68), matSkin);
            head.position.y = 1.88;
            head.castShadow = true;
            torso.add(head);

            // --- Left Arm Chain ---
            const leftShoulder = new THREE.Group();
            leftShoulder.position.set(-0.72, 1.18, 0);
            torso.add(leftShoulder);

            const upperLeftArm = new THREE.Mesh(new THREE.BoxGeometry(0.32, 0.68, 0.32), matRunner);
            upperLeftArm.position.y = -0.34;
            upperLeftArm.castShadow = true;
            leftShoulder.add(upperLeftArm);
            partsList.push(upperLeftArm);

            const leftElbow = new THREE.Group();
            leftElbow.position.set(0, -0.68, 0);
            leftShoulder.add(leftElbow);

            const lowerLeftArm = new THREE.Mesh(new THREE.BoxGeometry(0.28, 0.62, 0.28), matJoints);
            lowerLeftArm.position.y = -0.31;
            lowerLeftArm.castShadow = true;
            leftElbow.add(lowerLeftArm);

            // --- Right Arm Chain ---
            const rightShoulder = new THREE.Group();
            rightShoulder.position.set(0.72, 1.18, 0);
            torso.add(rightShoulder);

            const upperRightArm = new THREE.Mesh(new THREE.BoxGeometry(0.32, 0.68, 0.32), matRunner);
            upperRightArm.position.y = -0.34;
            upperRightArm.castShadow = true;
            rightShoulder.add(upperRightArm);
            partsList.push(upperRightArm);

            const rightElbow = new THREE.Group();
            rightElbow.position.set(0, -0.68, 0);
            rightShoulder.add(rightElbow);

            const lowerRightArm = new THREE.Mesh(new THREE.BoxGeometry(0.28, 0.62, 0.28), matJoints);
            lowerRightArm.position.y = -0.31;
            lowerRightArm.castShadow = true;
            rightElbow.add(lowerRightArm);

            // --- Left Leg Chain ---
            const leftHip = new THREE.Group();
            leftHip.position.set(-0.34, 0, 0);
            hipCenter.add(leftHip);

            const upperLeftLeg = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.78, 0.4), matRunner);
            upperLeftLeg.position.y = -0.39;
            upperLeftLeg.castShadow = true;
            leftHip.add(upperLeftLeg);
            partsList.push(upperLeftLeg);

            const leftKnee = new THREE.Group();
            leftKnee.position.set(0, -0.78, 0);
            leftHip.add(leftKnee);

            const lowerLeftLeg = new THREE.Mesh(new THREE.BoxGeometry(0.34, 0.72, 0.34), matJoints);
            lowerLeftLeg.position.y = -0.36;
            lowerLeftLeg.castShadow = true;
            leftKnee.add(lowerLeftLeg);

            // --- Right Leg Chain ---
            const rightHip = new THREE.Group();
            rightHip.position.set(0.34, 0, 0);
            hipCenter.add(rightHip);

            const upperRightLeg = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.78, 0.4), matRunner);
            upperRightLeg.position.y = -0.39;
            upperRightLeg.castShadow = true;
            rightHip.add(upperRightLeg);
            partsList.push(upperRightLeg);

            const rightKnee = new THREE.Group();
            rightKnee.position.set(0, -0.78, 0);
            rightHip.add(rightKnee);

            const lowerRightLeg = new THREE.Mesh(new THREE.BoxGeometry(0.34, 0.72, 0.34), matJoints);
            lowerRightLeg.position.y = -0.36;
            lowerRightLeg.castShadow = true;
            rightKnee.add(lowerRightLeg);

            const itLight = new THREE.PointLight(0xff0044, 0, 18);
            itLight.position.y = 3;
            container.add(itLight);

            container.userData = {
                partsList,
                hipCenter,
                torso,
                leftShoulder, leftElbow,
                rightShoulder, rightElbow,
                leftHip, leftKnee,
                rightHip, rightKnee,
                itLight,
                animTime: 0
            };

            return container;
        }

        let myPlayer;
        let basePlayerSpeed = 16;
        let playerSpeed = 16;
        let speedBoostTimer = 0;
        let lastTime = performance.now();

        // Physics & Animation State
        let velocityY = 0;
        let currentFloorY = 0;
        let isGrounded = true;
        const gravity = -38;
        const jumpForce = 15;
        let currentAnimState = 'idle';
        let actionAnimTimer = 0;
        let flipRotationAxis = new THREE.Vector3(1, 0, 0);

        function findSafeSpawnPosition() {
            const playerRadius = 1.2;
            const playerHeight = 4.5;
            for (let attempt = 0; attempt < 50; attempt++) {
                const rx = (Math.random() - 0.5) * 35;
                const rz = (Math.random() - 0.5) * 35;
                const playerBox = new THREE.Box3(
                    new THREE.Vector3(rx - playerRadius, 0, rz - playerRadius),
                    new THREE.Vector3(rx + playerRadius, playerHeight, rz + playerRadius)
                );
                let collided = false;
                for (let i = 0; i < colliderBoxes.length; i++) {
                    if (playerBox.intersectsBox(colliderBoxes[i])) { collided = true; break; }
                }
                if (!collided) return new THREE.Vector3(rx, 0, rz);
            }
            return new THREE.Vector3(0, 0, 15);
        }

        function initGame() {
            myPlayer = createNextGenHumanoidMesh();
            myPlayer.position.copy(findSafeSpawnPosition());
            scene.add(myPlayer);
            
            camera.position.set(0, 16, 22);
            camera.lookAt(myPlayer.position);

            isGameReady = true;
            
            if (!currentItId) {
                currentItId = clientId;
                mqttClient.publish(TOPIC_STATE, JSON.stringify({ currentIt: clientId }), { qos: 1, retain: true });
            }

            animate();
        }

        // ==========================================
        // 4. CONTROLS & EVENT LISTENERS
        // ==========================================
        const keys = { w: false, a: false, s: false, d: false, ArrowUp: false, ArrowDown: false, ArrowLeft: false, ArrowRight: false };
        let joyVector = new THREE.Vector2(0, 0);

        window.addEventListener('keydown', (e) => { 
            if(keys.hasOwnProperty(e.key)) keys[e.key] = true;
            if(e.code === 'Space') triggerJump();
            if(e.code === 'KeyQ') triggerActionA();
            if(e.code === 'KeyE') triggerActionB();
        });
        window.addEventListener('keyup', (e) => { if(keys.hasOwnProperty(e.key)) keys[e.key] = false; });

        document.getElementById('btn-jump').addEventListener('click', triggerJump);
        document.getElementById('btn-a').addEventListener('click', triggerActionA);
        document.getElementById('btn-b').addEventListener('click', triggerActionB);

        function triggerJump() {
            if (isGrounded && actionAnimTimer <= 0) {
                velocityY = jumpForce;
                isGrounded = false;
            }
        }

        function triggerActionA() {
            if (actionAnimTimer > 0) return;
            
            if (isGrounded) {
                for (let i = 0; i < vaultableBoxes.length; i++) {
                    const vb = vaultableBoxes[i];
                    if (myPlayer.position.distanceTo(vb.mesh.position) < 4.5 && vb.height <= 3.2) {
                        actionAnimTimer = 0.8;
                        currentAnimState = 'vault';
                        return;
                    }
                }
            }

            // Airborne Backflip (Camera independent rotation axis)
            if (!isGrounded) {
                actionAnimTimer = 0.85;
                currentAnimState = 'backflip';
                // Calculate local sideways flip axis based on camera orientation
                const camDir = new THREE.Vector3();
                camera.getWorldDirection(camDir);
                camDir.y = 0;
                camDir.normalize();
                flipRotationAxis = new THREE.Vector3(-camDir.z, 0, camDir.x);
            }
        }

        function triggerActionB() {
            if (actionAnimTimer > 0) return;

            // Airborne Frontflip
            if (!isGrounded) {
                actionAnimTimer = 0.85;
                currentAnimState = 'frontflip';
                const camDir = new THREE.Vector3();
                camera.getWorldDirection(camDir);
                camDir.y = 0;
                camDir.normalize();
                flipRotationAxis = new THREE.Vector3(camDir.z, 0, -camDir.x);
            }
        }

        // Virtual Joystick
        const joyZone = document.getElementById('joystick-zone');
        const joyKnob = document.getElementById('joystick-knob');
        let joyActive = false;
        let joyCenter = { x: 0, y: 0 };
        const maxJoyRadius = 40;

        joyZone.addEventListener('touchstart', (e) => {
            e.preventDefault();
            joyActive = true;
            const rect = joyZone.getBoundingClientRect();
            joyCenter = { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 };
            updateJoystick(e.touches[0]);
        }, { passive: false });

        joyZone.addEventListener('touchmove', (e) => {
            e.preventDefault();
            if(joyActive) updateJoystick(e.touches[0]);
        }, { passive: false });

        joyZone.addEventListener('touchend', (e) => {
            e.preventDefault();
            joyActive = false;
            joyKnob.style.transform = `translate(-50%, -50%)`;
            joyVector.set(0, 0);
        }, { passive: false });

        function updateJoystick(touch) {
            let dx = touch.clientX - joyCenter.x;
            let dy = touch.clientY - joyCenter.y;
            const distance = Math.sqrt(dx*dx + dy*dy);
            if (distance > maxJoyRadius) {
                dx = (dx / distance) * maxJoyRadius;
                dy = (dy / distance) * maxJoyRadius;
            }
            joyKnob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
            joyVector.set(dx / maxJoyRadius, dy / maxJoyRadius);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // ==========================================
        // 5. NETWORK SYNC LOOP
        // ==========================================
        function startNetworkLoop() {
            setInterval(() => {
                if (!isGameReady) return;
                mqttClient.publish(TOPIC_POSITIONS, JSON.stringify({
                    id: clientId,
                    x: myPlayer.position.x,
                    y: myPlayer.position.y,
                    z: myPlayer.position.z,
                    animState: currentAnimState
                }), { qos: 0 });
            }, SYNC_RATE_MS);
        }

        function updateItStatus(newItId) {
            currentItId = newItId;
            const statusBox = document.getElementById('status-box');

            if (currentItId === clientId) {
                statusBox.innerText = "YOU ARE IT! CATCH THEM!";
                statusBox.className = "is-it";
            } else {
                statusBox.innerText = "RUN! AVOID THE RED PLAYER!";
                statusBox.className = "is-safe";
            }

            updatePlayerAppearance(myPlayer, currentItId === clientId);
            for (let id in remotePlayerMeshes) {
                updatePlayerAppearance(remotePlayerMeshes[id], currentItId === id);
            }
        }

        function updatePlayerAppearance(humanoidGroup, isIt) {
            const material = isIt ? matIt : matRunner;
            humanoidGroup.userData.partsList.forEach(mesh => {
                mesh.material = material;
            });
            humanoidGroup.userData.itLight.intensity = isIt ? 3.0 : 0;
        }

        // ==========================================
        // 6. ANIMATION & JOINT RIGGING ENGINE
        // ==========================================
        function updateHumanoidAnimation(group, isMoving, animState, time, delta) {
            const ud = group.userData;
            const { torso, leftShoulder, leftElbow, rightShoulder, rightElbow, leftHip, leftKnee, rightHip, rightKnee } = ud;

            torso.rotation.set(0, 0, 0);

            if (animState === 'vault') {
                ud.animTime += delta * 6;
                const p = ud.animTime;
                torso.rotation.x = Math.sin(p * Math.PI) * 0.9;
                leftShoulder.rotation.x = -Math.PI / 1.8;
                rightShoulder.rotation.x = -Math.PI / 1.8;
                leftKnee.rotation.x = 1.3;
                rightKnee.rotation.x = 0.3;
                if (p >= 1.0) { ud.animTime = 0; currentAnimState = 'idle'; }
                return;
            }

            if (animState === 'backflip' || animState === 'frontflip') {
                ud.animTime += delta * 6;
                const p = ud.animTime;
                group.rotateOnAxis(flipRotationAxis, (animState === 'backflip' ? -1 : 1) * delta * Math.PI * 3.2);
                if (p >= 1.0) { 
                    ud.animTime = 0; 
                    group.quaternion.identity(); 
                    currentAnimState = 'idle'; 
                }
                return;
            }

            if (!isGrounded) {
                leftShoulder.rotation.x = -0.6;
                rightShoulder.rotation.x = -0.6;
                leftKnee.rotation.x = 0.6;
                rightKnee.rotation.x = 0.6;
                return;
            }

            if (isMoving) {
                const cycle = time * 0.028;
                const swing = Math.sin(cycle) * 1.2;
                
                leftShoulder.rotation.x = swing;
                rightShoulder.rotation.x = -swing;
                leftElbow.rotation.x = -Math.abs(Math.sin(cycle)) * 0.9 - 0.2;
                rightElbow.rotation.x = -Math.abs(Math.cos(cycle)) * 0.9 - 0.2;

                leftHip.rotation.x = -swing * 0.95;
                rightHip.rotation.x = swing * 0.95;
                leftKnee.rotation.x = Math.max(0, Math.sin(cycle)) * 1.3;
                rightKnee.rotation.x = Math.max(0, -Math.sin(cycle)) * 1.3;

                torso.rotation.x = 0.2;
            } else {
                leftShoulder.rotation.x = THREE.MathUtils.lerp(leftShoulder.rotation.x, 0, 0.12);
                rightShoulder.rotation.x = THREE.MathUtils.lerp(rightShoulder.rotation.x, 0, 0.12);
                leftElbow.rotation.x = THREE.MathUtils.lerp(leftElbow.rotation.x, 0, 0.12);
                rightElbow.rotation.x = THREE.MathUtils.lerp(rightElbow.rotation.x, 0, 0.12);
                leftHip.rotation.x = THREE.MathUtils.lerp(leftHip.rotation.x, 0, 0.12);
                rightHip.rotation.x = THREE.MathUtils.lerp(rightHip.rotation.x, 0, 0.12);
                leftKnee.rotation.x = THREE.MathUtils.lerp(leftKnee.rotation.x, 0, 0.12);
                rightKnee.rotation.x = THREE.MathUtils.lerp(rightKnee.rotation.x, 0, 0.12);
                torso.rotation.x = THREE.MathUtils.lerp(torso.rotation.x, 0, 0.12);
            }
        }

        // ==========================================
        // 7. MAIN GAME LOOP & BLOCK CLIMBING
        // ==========================================
        function animate() {
            requestAnimationFrame(animate);
            if (!isGameReady) return;

            const time = performance.now();
            const delta = (time - lastTime) / 1000;
            lastTime = time;

            if (speedBoostTimer > 0 && time > speedBoostTimer) {
                playerSpeed = basePlayerSpeed;
                speedBoostTimer = 0;
            }

            if (actionAnimTimer > 0) {
                actionAnimTimer -= delta;
            }

            let moveX = 0;
            let moveZ = 0;
            if (keys.w || keys.ArrowUp) moveZ -= 1;
            if (keys.s || keys.ArrowDown) moveZ += 1;
            if (keys.a || keys.ArrowLeft) moveX -= 1;
            if (keys.d || keys.ArrowRight) moveX += 1;

            if (joyVector.lengthSq() > 0) {
                moveX = joyVector.x;
                moveZ = joyVector.y;
            } else if (moveX !== 0 || moveZ !== 0) {
                const length = Math.sqrt(moveX*moveX + moveZ*moveZ);
                moveX /= length;
                moveZ /= length;
            }

            const playerRadius = 1.2;
            const playerHeight = 4.5; 

            // Horizontal Collision Check
            const checkCollision = (px, pz, py) => {
                const playerBox = new THREE.Box3(
                    new THREE.Vector3(px - playerRadius, py + 0.1, pz - playerRadius),
                    new THREE.Vector3(px + playerRadius, py + playerHeight, pz + playerRadius)
                );
                for (let i = 0; i < colliderBoxes.length; i++) {
                    if (playerBox.intersectsBox(colliderBoxes[i])) return true;
                }
                return false;
            };

            // Vertical Platform Detection (Landing on top of blocks)
            let targetFloorY = 0;
            const playerFootBox = new THREE.Box3(
                new THREE.Vector3(myPlayer.position.x - playerRadius + 0.2, myPlayer.position.y, myPlayer.position.z - playerRadius + 0.2),
                new THREE.Vector3(myPlayer.position.x + playerRadius - 0.2, myPlayer.position.y + 0.5, myPlayer.position.z + playerRadius - 0.2)
            );

            for (let i = 0; i < colliderBoxes.length; i++) {
                const box = colliderBoxes[i];
                if (playerFootBox.intersectsBox(box)) {
                    if (box.max.y > targetFloorY && myPlayer.position.y >= box.max.y - 1.2) {
                        targetFloorY = box.max.y;
                    }
                }
            }

            // Gravity & Vertical Physics
            if (myPlayer.position.y > targetFloorY) {
                velocityY += gravity * delta;
                myPlayer.position.y += velocityY * delta;
                if (myPlayer.position.y <= targetFloorY) {
                    myPlayer.position.y = targetFloorY;
                    velocityY = 0;
                    isGrounded = true;
                }
            } else {
                myPlayer.position.y = targetFloorY;
                velocityY = 0;
                isGrounded = true;
            }

            // Horizontal Movement & Sliding against walls
            const proposedX = myPlayer.position.x + moveX * playerSpeed * delta;
            const proposedZ = myPlayer.position.z + moveZ * playerSpeed * delta;

            let isMoving = false;
            if (moveX !== 0 || moveZ !== 0) {
                isMoving = true;
                if (!checkCollision(proposedX, myPlayer.position.z, myPlayer.position.y)) myPlayer.position.x = proposedX;
                if (!checkCollision(myPlayer.position.x, proposedZ, myPlayer.position.y)) myPlayer.position.z = proposedZ;

                myPlayer.rotation.y = Math.atan2(moveX, moveZ);
            }

            updateHumanoidAnimation(myPlayer, isMoving, currentAnimState, time, delta);

            // Power-ups collection
            powerUps.forEach(p => {
                p.rotation.y += 0.03;
                p.rotation.x += 0.015;
            });

            for (let i = powerUps.length - 1; i >= 0; i--) {
                const p = powerUps[i];
                if (myPlayer.position.distanceTo(p.position) < 2.6) {
                    playerSpeed = basePlayerSpeed * 1.65;
                    speedBoostTimer = time + 5000;
                    p.position.set((Math.random() - 0.5) * (ARENA_SIZE - 25), 2.0, (Math.random() - 0.5) * (ARENA_SIZE - 25));
                }
            }

            camera.position.lerp(new THREE.Vector3(myPlayer.position.x, myPlayer.position.y + 17, myPlayer.position.z + 24), 0.1);
            camera.lookAt(myPlayer.position);

            // Clean stale remote players
            const now = Date.now();
            for (let id in remotePlayersData) {
                if (now - remotePlayersData[id].lastUpdate > 4000) {
                    scene.remove(remotePlayerMeshes[id]);
                    delete remotePlayerMeshes[id];
                    delete remotePlayersData[id];
                }
            }

            // Interpolate remote players
            for (let id in remotePlayerMeshes) {
                const mesh = remotePlayerMeshes[id];
                const target = remotePlayersData[id];
                
                const oldX = mesh.position.x;
                const oldZ = mesh.position.z;
                
                mesh.position.x += (target.targetX - mesh.position.x) * 0.15;
                mesh.position.y += (target.targetY - mesh.position.y) * 0.15;
                mesh.position.z += (target.targetZ - mesh.position.z) * 0.15;

                const dx = target.targetX - oldX;
                const dz = target.targetZ - oldZ;
                const remoteMoving = (Math.abs(dx) > 0.02 || Math.abs(dz) > 0.02);
                
                if (remoteMoving) {
                    mesh.rotation.y = Math.atan2(target.targetX - oldX, target.targetZ - oldZ);
                }

                updateHumanoidAnimation(mesh, remoteMoving, target.animState || 'idle', time, delta);
            }

            // Tagging logic
            if (currentItId === clientId && time > tagCooldown) {
                for (let id in remotePlayerMeshes) {
                    const mesh = remotePlayerMeshes[id];
                    if (myPlayer.position.distanceTo(mesh.position) < TAG_DISTANCE) {
                        tagCooldown = time + 2000;
                        mqttClient.publish(TOPIC_STATE, JSON.stringify({ currentIt: id }), { qos: 1, retain: true });
                        break;
                    }
                }
            }

            renderer.render(scene, camera);
        }
    </script>
