<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>P2P Host & Controller</title>
    <!-- Include PeerJS for easy WebRTC -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { 
            font-family: system-ui, -apple-system, sans-serif; 
            margin: 0; 
            padding: 0; 
            background: #121212; 
            color: white; 
            text-align: center; 
            overflow: hidden;
            touch-action: none; /* Prevents pull-to-refresh on mobile */
        }
        
        /* Menu Screen */
        #menu { 
            padding-top: 20vh; 
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }
        button { 
            padding: 15px 30px; 
            font-size: 18px; 
            cursor: pointer; 
            border-radius: 8px; 
            border: none; 
            background: #007bff; 
            color: white; 
            font-weight: bold;
            width: 80%;
            max-width: 300px;
            transition: transform 0.1s, background 0.2s;
        }
        button:active { 
            background: #0056b3; 
            transform: scale(0.95);
        }
        
        /* Host Display Screen */
        #host-screen { 
            display: none; 
            width: 100vw; 
            height: 100vh; 
            position: relative; 
            /* City map background using CSS grid */
            background-color: #444; /* Road color */
            background-image:
                linear-gradient(#1a1a1a 120px, transparent 120px),
                linear-gradient(90deg, #1a1a1a 120px, transparent 120px);
            background-size: 150px 150px; /* Size of the city blocks */
            background-position: 15px 15px; /* Offset for the roads */
        }
        #host-ui { 
            position: absolute; 
            top: 10px; 
            left: 10px; 
            background: rgba(0,0,0,0.7); 
            padding: 15px; 
            border-radius: 8px; 
            text-align: left;
        }
        #host-ui h2 { margin: 0 0 5px 0; font-size: 20px; }
        #host-ui p { margin: 0; color: #aaa; }
        #player-avatar { 
            position: absolute; 
            top: 50%; 
            left: 50%; 
            transform: translate(-50%, -50%); 
            transition: 0.1s linear;
            font-size: 70px; /* Size of the hand */
            display: flex;
            justify-content: center;
            align-items: center;
            filter: drop-shadow(4px 6px 5px rgba(0,0,0,0.6));
            z-index: 10;
        }
        
        /* Controller Screen */
        #controller-screen { 
            display: none; 
            padding: 20px; 
            height: 100vh; 
            box-sizing: border-box; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center;
        }
        input { 
            padding: 15px; 
            font-size: 20px; 
            text-align: center; 
            border-radius: 8px; 
            border: 2px solid #333; 
            background: #222;
            color: white;
            margin-bottom: 15px; 
            width: 100%; 
            max-width: 300px; 
            outline: none;
        }
        input:focus {
            border-color: #007bff;
        }
        
        /* D-Pad Layout */
        .d-pad { 
            display: grid; 
            grid-template-columns: 80px 80px 80px; 
            grid-template-rows: 80px 80px 80px; 
            gap: 10px; 
            margin-top: 40px; 
        }
        .d-pad button { 
            margin: 0; 
            width: 100%; 
            height: 100%; 
            font-size: 30px; 
            background: #333; 
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .d-pad button:active { background: #555; }
        .btn-up { grid-column: 2; grid-row: 1; }
        .btn-left { grid-column: 1; grid-row: 2; }
        .btn-right { grid-column: 3; grid-row: 2; }
        .btn-down { grid-column: 2; grid-row: 3; }
    </style>
</head>
<body>

    <!-- 1. MAIN MENU -->
    <div id="menu">
        <h1 style="margin-bottom: 30px;">P2P Game Engine</h1>
        <button onclick="initHost()">Create Room (Display)</button>
        <button onclick="showJoinScreen()">Join Room (Controller)</button>
    </div>

    <!-- 2. HOST DISPLAY -->
    <div id="host-screen">
        <div id="host-ui">
            <h2>Room ID: <span id="room-id" style="color: #00ea1c;">Loading...</span></h2>
            <p id="host-status">Waiting for player...</p>
        </div>
        <div id="player-avatar">🤚</div>
    </div>

    <!-- 3. CONTROLLER DISPLAY -->
    <div id="controller-screen">
        <div id="join-ui" style="display: flex; flex-direction: column; align-items: center; width: 100%;">
            <h2>Enter Room ID</h2>
            <input type="number" id="join-id-input" placeholder="e.g. 12345">
            <button onclick="joinHost()">Connect</button>
            <p id="controller-status" style="margin-top: 15px; color: #aaa;"></p>
        </div>
        
        <!-- Gamepad hidden until connected -->
        <div id="gamepad" style="display: none;">
            <h2 style="color: #00ea1c; margin-bottom: 10px;">Connected!</h2>
            <p style="color: #aaa; margin-top: 0;">Use the D-Pad to move</p>
            <div class="d-pad">
                <button class="btn-up" onmousedown="sendMove('up')" ontouchstart="sendMove('up'); event.preventDefault();">⬆️</button>
                <button class="btn-left" onmousedown="sendMove('left')" ontouchstart="sendMove('left'); event.preventDefault();">⬅️</button>
                <button class="btn-right" onmousedown="sendMove('right')" ontouchstart="sendMove('right'); event.preventDefault();">➡️</button>
                <button class="btn-down" onmousedown="sendMove('down')" ontouchstart="sendMove('down'); event.preventDefault();">⬇️</button>
            </div>
        </div>
    </div>

    <script>
        let peer = null;
        let connection = null;

        // --- HOST LOGIC ---
        let playerPos = { x: window.innerWidth / 2, y: window.innerHeight / 2 };
        const moveSpeed = 30;

        function initHost() {
            document.getElementById('menu').style.display = 'none';
            document.getElementById('host-screen').style.display = 'block';

            // Generate a random 5-digit room ID for simplicity
            const roomId = Math.floor(10000 + Math.random() * 90000).toString();
            
            peer = new Peer(roomId);

            peer.on('open', (id) => {
                document.getElementById('room-id').innerText = id;
            });

            peer.on('connection', (conn) => {
                document.getElementById('host-status').innerText = "Player Connected!";
                document.getElementById('host-status').style.color = "#00ea1c";
                
                // Listen for incoming controller data
                conn.on('data', (data) => {
                    if(data.type === 'move') {
                        updatePlayerPosition(data.direction);
                    }
                });
            });

            peer.on('error', (err) => {
                document.getElementById('host-status').innerText = "Error: " + err.type;
                document.getElementById('host-status').style.color = "#ff4757";
            });
        }

        function updatePlayerPosition(direction) {
            const avatar = document.getElementById('player-avatar');
            if (direction === 'up') playerPos.y -= moveSpeed;
            if (direction === 'down') playerPos.y += moveSpeed;
            if (direction === 'left') playerPos.x -= moveSpeed;
            if (direction === 'right') playerPos.x += moveSpeed;

            // Keep within screen bounds
            playerPos.x = Math.max(25, Math.min(window.innerWidth - 25, playerPos.x));
            playerPos.y = Math.max(25, Math.min(window.innerHeight - 25, playerPos.y));

            avatar.style.left = playerPos.x + 'px';
            avatar.style.top = playerPos.y + 'px';
        }

        // --- CONTROLLER LOGIC ---
        function showJoinScreen() {
            document.getElementById('menu').style.display = 'none';
            document.getElementById('controller-screen').style.display = 'flex';
        }

        function joinHost() {
            const hostId = document.getElementById('join-id-input').value;
            if (!hostId) {
                document.getElementById('controller-status').innerText = "Please enter an ID.";
                return;
            }

            document.getElementById('controller-status').innerText = "Connecting...";
            
            peer = new Peer(); // Controller gets a random ID
            
            peer.on('open', () => {
                connection = peer.connect(hostId);
                
                connection.on('open', () => {
                    document.getElementById('join-ui').style.display = 'none';
                    document.getElementById('gamepad').style.display = 'flex';
                    document.getElementById('gamepad').style.flexDirection = 'column';
                    document.getElementById('gamepad').style.alignItems = 'center';
                });

                connection.on('error', (err) => {
                    document.getElementById('controller-status').innerText = "Connection failed.";
                });
            });

            peer.on('error', (err) => {
                document.getElementById('controller-status').innerText = "Could not find room.";
            });
        }

        function sendMove(direction) {
            if (connection && connection.open) {
                connection.send({ type: 'move', direction: direction });
                // Optional: Trigger a tiny haptic vibration on mobile if supported
                if (navigator.vibrate) {
                    navigator.vibrate(20); 
                }
            }
        }
        
        // Handle window resize for the host screen bounds
        window.addEventListener('resize', () => {
            if (document.getElementById('host-screen').style.display === 'block') {
                const avatar = document.getElementById('player-avatar');
                playerPos.x = Math.max(25, Math.min(window.innerWidth - 25, playerPos.x));
                playerPos.y = Math.max(25, Math.min(window.innerHeight - 25, playerPos.y));
                avatar.style.left = playerPos.x + 'px';
                avatar.style.top = playerPos.y + 'px';
            }
        });
    </script>
</body>
</html>
