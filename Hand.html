<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D P2P Hand Controller</title>
    
    <!-- PeerJS for P2P Connection -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <!-- Three.js for 3D Rendering -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <style>
        body { 
            font-family: system-ui, -apple-system, sans-serif; 
            margin: 0; 
            padding: 0; 
            background: #121212; 
            color: white; 
            text-align: center; 
            overflow: hidden;
            touch-action: none;
        }
        
        /* Menus and UI overlays */
        .overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: #121212;
            z-index: 100;
        }
        
        button { 
            padding: 15px 30px; 
            font-size: 18px; 
            cursor: pointer; 
            border-radius: 8px; 
            border: none; 
            background: #007bff; 
            color: white; 
            font-weight: bold;
            margin: 10px;
            width: 80%;
            max-width: 300px;
            transition: transform 0.1s, background 0.2s;
        }
        button:active { background: #0056b3; transform: scale(0.95); }
        
        input { 
            padding: 15px; 
            font-size: 20px; 
            text-align: center; 
            border-radius: 8px; 
            border: 2px solid #333; 
            background: #222;
            color: white;
            margin-bottom: 15px; 
            width: 80%; 
            max-width: 300px; 
        }

        /* Host Screen Specifics */
        #host-ui { 
            position: absolute; 
            top: 20px; 
            left: 20px; 
            background: rgba(0,0,0,0.7); 
            padding: 15px; 
            border-radius: 8px; 
            text-align: left;
            z-index: 10;
            display: none;
        }
        #host-ui h2 { margin: 0 0 5px 0; color: #fff; font-size: 20px;}
        #host-ui p { margin: 0; color: #aaa; }
        
        /* 3D Canvas */
        #game-canvas { display: block; width: 100vw; height: 100vh; position: absolute; top:0; left:0; z-index: 1;}

        /* Controller Specifics */
        #controller-gamepad {
            display: none;
            width: 100vw;
            height: 100vh;
            background: #222;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 40px 20px;
            box-sizing: border-box;
        }
        
        .controls-row {
            display: flex;
            justify-content: center;
            gap: 20px;
            width: 100%;
            margin-bottom: 30px;
        }

        .action-btn {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            user-select: none;
            font-size: 22px;
            font-weight: bold;
            transition: all 0.1s;
        }

        .btn-fly {
            background: rgba(0, 234, 28, 0.2);
            border: 4px solid #00ea1c;
            color: #00ea1c;
            box-shadow: 0 0 20px rgba(0, 234, 28, 0.4);
        }
        .btn-fly:active {
            background: rgba(0, 234, 28, 0.6);
            transform: scale(0.95);
            box-shadow: 0 0 40px rgba(0, 234, 28, 0.8);
            color: white;
        }

        .btn-grab {
            background: rgba(255, 153, 0, 0.2);
            border: 4px solid #ff9900;
            color: #ff9900;
            box-shadow: 0 0 20px rgba(255, 153, 0, 0.4);
        }
        .btn-grab:active {
            background: rgba(255, 153, 0, 0.6);
            transform: scale(0.95);
            box-shadow: 0 0 40px rgba(255, 153, 0, 0.8);
            color: white;
        }

        .sensor-status { color: #aaa; font-size: 14px; margin-top: 20px;}
    </style>
</head>
<body>

    <!-- 1. MAIN MENU -->
    <div id="menu" class="overlay">
        <h1 style="margin-bottom: 10px;">3D Motion Engine</h1>
        <p style="color:#aaa; margin-bottom: 40px; max-width: 400px;">Host the game on a PC/Display, then join from your phone to use it as a motion controller.</p>
        <button onclick="initHost()">Create Room (Host Display)</button>
        <button onclick="showJoinScreen()">Join Room (Phone Controller)</button>
    </div>

    <!-- 2. HOST UI (3D Canvas is handled by ThreeJS) -->
    <div id="host-ui">
        <h2>Room ID: <span id="room-id" style="color: #00ea1c;">Loading...</span></h2>
        <p id="host-status">Waiting for phone...</p>
    </div>

    <!-- 3. CONTROLLER JOIN SCREEN -->
    <div id="join-screen" class="overlay" style="display: none;">
        <h2>Enter Room ID</h2>
        <input type="number" id="join-id-input" placeholder="12345">
        <button onclick="joinHost()">Connect Phone</button>
        <p id="controller-status" style="margin-top: 15px; color: #aaa;"></p>
    </div>

    <!-- 4. CONTROLLER GAMEPAD (Active Play) -->
    <div id="controller-gamepad" class="overlay" style="display: none; background: #111;">
        <div>
            <h2 style="color: #00ea1c; margin: 0;">Connected!</h2>
            <p style="color: #aaa; margin: 5px 0;">Point phone to look around</p>
            <div id="sensor-data" class="sensor-status">Sensors: Waiting...</div>
        </div>
        
        <div class="controls-row">
            <!-- GRAB Button -->
            <div class="action-btn btn-grab" 
                 onmousedown="startGrab()" onmouseup="stopGrab()" onmouseleave="stopGrab()"
                 ontouchstart="startGrab(); event.preventDefault();" ontouchend="stopGrab(); event.preventDefault();">
                GRAB
            </div>
            
            <!-- FLY Button -->
            <div class="action-btn btn-fly" 
                 onmousedown="startThrust()" onmouseup="stopThrust()" onmouseleave="stopThrust()"
                 ontouchstart="startThrust(); event.preventDefault();" ontouchend="stopThrust(); event.preventDefault();">
                FLY
            </div>
        </div>
        
        <!-- Essential for iOS to request gyroscope permissions -->
        <button id="sensor-btn" onclick="requestSensorAccess()" style="display: none;">Enable Motion Sensors</button>
    </div>

    <script>
        let peer = null;
        let connection = null;

        // --- GLOBAL P2P STATE ---
        let currentMotion = { alpha: 0, beta: 0, gamma: 0, thrust: false, grab: false };

        // ==========================================
        // =              HOST LOGIC                =
        // ==========================================
        let scene, camera, renderer, handGroup;
        let fingers = []; // Store finger joints for animation
        let thumbPivot;
        let isHost = false;

        function initHost() {
            isHost = true;
            document.getElementById('menu').style.display = 'none';
            document.getElementById('host-ui').style.display = 'block';

            const roomId = Math.floor(10000 + Math.random() * 90000).toString();
            peer = new Peer(roomId);

            peer.on('open', (id) => {
                document.getElementById('room-id').innerText = id;
            });

            peer.on('connection', (conn) => {
                document.getElementById('host-status').innerText = "Phone Connected! Sensors active.";
                document.getElementById('host-status').style.color = "#00ea1c";
                
                // Receive motion data from phone
                conn.on('data', (data) => {
                    if(data.type === 'motion') {
                        currentMotion.alpha = data.alpha;
                        currentMotion.beta = data.beta;
                        currentMotion.gamma = data.gamma;
                        currentMotion.thrust = data.thrust;
                        currentMotion.grab = data.grab;
                    }
                });
            });

            initThreeJS();
        }

        function initThreeJS() {
            // Setup Scene
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87CEEB); // Sky blue
            scene.fog = new THREE.Fog(0x87CEEB, 20, 150);

            // Setup Camera
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            
            // Setup Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.domElement.id = 'game-canvas';
            document.body.appendChild(renderer.domElement);

            // Add Lights
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(50, 100, 50);
            scene.add(dirLight);

            // Build the City Map
            buildCity();

            // Build the 3D Right Hand
            buildHand();

            // Handle Resize
            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            // Start Game Loop
            animate();
        }

        function buildCity() {
            // Ground
            const groundGeo = new THREE.PlaneGeometry(500, 500);
            const groundMat = new THREE.MeshLambertMaterial({ color: 0x333333 });
            const ground = new THREE.Mesh(groundGeo, groundMat);
            ground.rotation.x = -Math.PI / 2;
            scene.add(ground);

            // Random Buildings
            const buildingGeo = new THREE.BoxGeometry(1, 1, 1);
            for(let i=0; i<200; i++) {
                // Different shades of gray/glass for buildings
                const col = new THREE.Color().setHSL(0, 0, Math.random() * 0.3 + 0.2);
                const mat = new THREE.MeshLambertMaterial({ color: col });
                const building = new THREE.Mesh(buildingGeo, mat);
                
                const width = Math.random() * 4 + 2;
                const height = Math.random() * 30 + 5;
                const depth = Math.random() * 4 + 2;
                
                building.scale.set(width, height, depth);
                
                const x = (Math.random() - 0.5) * 200;
                const z = (Math.random() - 0.5) * 200;
                
                building.position.set(x, height / 2, z);
                scene.add(building);
            }
        }

        function buildHand() {
            handGroup = new THREE.Group();
            
            const skinMat = new THREE.MeshLambertMaterial({ color: 0xffccaa }); // Skin tone

            // Palm (flat, facing up/down)
            const palm = new THREE.Mesh(new THREE.BoxGeometry(1.4, 0.3, 1.4), skinMat);
            handGroup.add(palm);

            // Fingers pointing -Z (Forward). We use pivots to bend them at the knuckles.
            const createFinger = (x, z, w, d) => {
                const pivot = new THREE.Group();
                pivot.position.set(x, 0, z); // Position pivot at the knuckle
                
                const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, 0.25, d), skinMat);
                mesh.position.set(0, 0, -d/2); // Offset the mesh from the knuckle
                pivot.add(mesh);
                
                return pivot;
            };

            // Fingers arranged from Left (Index) to Right (Pinky) for a Right Hand (Palm down)
            const indexF = createFinger(-0.5, -0.7, 0.25, 0.8);
            const middleF = createFinger(-0.15, -0.7, 0.25, 0.9);
            const ringF = createFinger(0.2, -0.7, 0.25, 0.8);
            const pinkyF = createFinger(0.55, -0.7, 0.2, 0.6);
            
            fingers = [indexF, middleF, ringF, pinkyF];
            fingers.forEach(f => handGroup.add(f));
            
            // Thumb setup (pivot at the base of the thumb)
            thumbPivot = new THREE.Group();
            thumbPivot.position.set(-0.7, 0, -0.2); 
            thumbPivot.rotation.y = -Math.PI / 4; // Angle outward
            
            const thumbMesh = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.25, 0.6), skinMat);
            thumbMesh.position.set(-0.15, 0, -0.3); // Offset outward
            thumbPivot.add(thumbMesh);
            handGroup.add(thumbPivot);

            // Initial position (hovering above ground)
            handGroup.position.set(0, 10, 20);
            scene.add(handGroup);
        }

        // --- GAME LOOP ---
        function animate() {
            if (!isHost) return;
            requestAnimationFrame(animate);

            // 1. Map Phone Orientation to Hand Rotation
            // We use standard AR/VR mapping so the top of the phone equals the tip of the fingers
            if (currentMotion.beta !== null) {
                const deg2rad = Math.PI / 180;
                const alpha = currentMotion.alpha ? currentMotion.alpha * deg2rad : 0;
                const beta = currentMotion.beta ? currentMotion.beta * deg2rad : 0;
                const gamma = currentMotion.gamma ? currentMotion.gamma * deg2rad : 0;

                // Standard WebKit device orientation to Euler
                const euler = new THREE.Euler(beta, alpha, -gamma, 'YXZ');
                const targetQuat = new THREE.Quaternion().setFromEuler(euler);
                
                // Apply a -90 degree rotation on the X axis to correct the resting position.
                // This makes it so holding the phone vertically (portrait) points the hand straight forward.
                const q1 = new THREE.Quaternion(-Math.sqrt(0.5), 0, 0, Math.sqrt(0.5)); 
                targetQuat.multiply(q1);
                
                // Slerp (smooth interpolation) towards the target rotation
                handGroup.quaternion.slerp(targetQuat, 0.15);
            }

            // 2. Animate Finger Grabbing
            const targetFingerRotation = currentMotion.grab ? -Math.PI / 2.2 : 0; // Curl 80 degrees down
            const targetThumbRotation = currentMotion.grab ? -Math.PI / 3 : 0; // Fold thumb in
            
            // Smoothly interpolate each finger joint to the target rotation
            fingers.forEach(finger => {
                finger.rotation.x += (targetFingerRotation - finger.rotation.x) * 0.2;
            });
            if (thumbPivot) {
                thumbPivot.rotation.x += (targetThumbRotation - thumbPivot.rotation.x) * 0.2;
            }

            // 3. Move Forward if Thrust is active
            if (currentMotion.thrust) {
                // Translate along the local -Z axis (where the fingers point)
                handGroup.translateZ(-0.6); 
            }

            // 4. Camera Follows the Hand
            // Position camera slightly behind and above the hand
            const relativeCameraOffset = new THREE.Vector3(0, 3, 7); 
            const cameraOffset = relativeCameraOffset.applyMatrix4(handGroup.matrixWorld);
            
            // Smoothly move camera
            camera.position.lerp(cameraOffset, 0.1);
            // Camera always looks at the hand
            camera.lookAt(handGroup.position);

            renderer.render(scene, camera);
        }


        // ==========================================
        // =           CONTROLLER LOGIC             =
        // ==========================================
        let isThrusting = false;
        let isGrabbing = false;
        let sensorInterval;

        function showJoinScreen() {
            document.getElementById('menu').style.display = 'none';
            document.getElementById('join-screen').style.display = 'flex';
        }

        function joinHost() {
            const hostId = document.getElementById('join-id-input').value;
            if (!hostId) return;

            document.getElementById('controller-status').innerText = "Connecting...";
            peer = new Peer(); 
            
            peer.on('open', () => {
                connection = peer.connect(hostId);
                
                connection.on('open', () => {
                    document.getElementById('join-screen').style.display = 'none';
                    document.getElementById('controller-gamepad').style.display = 'flex';
                    
                    // Show sensor button (crucial for iOS Safari which requires user click)
                    document.getElementById('sensor-btn').style.display = 'block';
                });
            });
        }

        // --- MOTION SENSORS ---
        function requestSensorAccess() {
            // iOS 13+ requires explicit permission for device orientation
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission()
                    .then(permissionState => {
                        if (permissionState === 'granted') {
                            startSensors();
                        } else {
                            alert("Permission denied. Game needs sensors to work!");
                        }
                    })
                    .catch(console.error);
            } else {
                // Android and older devices
                startSensors();
            }
        }

        function startSensors() {
            document.getElementById('sensor-btn').style.display = 'none';
            document.getElementById('sensor-data').innerText = "Sensors: Active - Move Phone!";
            
            window.addEventListener('deviceorientation', handleOrientation);

            // Send data at ~30 FPS to save bandwidth
            sensorInterval = setInterval(() => {
                if (connection && connection.open) {
                    connection.send({ 
                        type: 'motion', 
                        alpha: currentMotion.alpha, 
                        beta: currentMotion.beta, 
                        gamma: currentMotion.gamma,
                        thrust: isThrusting,
                        grab: isGrabbing
                    });
                }
            }, 30);
        }

        function handleOrientation(event) {
            // Calculate a baseline or just send raw. 
            // Different devices handle absolute alpha differently.
            currentMotion.alpha = event.alpha; // Z-axis rotation (compass)
            currentMotion.beta = event.beta;   // X-axis rotation (tilt front/back)
            currentMotion.gamma = event.gamma; // Y-axis rotation (tilt left/right)
        }

        // --- THRUST CONTROLS ---
        function startThrust() {
            isThrusting = true;
            if(navigator.vibrate) navigator.vibrate(50); // Haptic feedback
        }

        function stopThrust() {
            isThrusting = false;
        }
        
        // --- GRAB CONTROLS ---
        function startGrab() {
            isGrabbing = true;
            if(navigator.vibrate) navigator.vibrate(30); 
        }

        function stopGrab() {
            isGrabbing = false;
        }

    </script>
</body>
</html>
