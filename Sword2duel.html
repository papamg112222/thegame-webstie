<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>P2P Sword Duel</title>
    <!-- PeerJS for P2P connection -->
    <script src="https://unpkg.com/peerjs@1.5.0/dist/peerjs.min.js"></script>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Three.js for 3D Graphics -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <style>
        body { 
            font-family: 'Inter', system-ui, sans-serif; 
            background: #0f172a; 
            color: #f1f5f9; 
            text-align: center; 
            overflow: hidden; 
            touch-action: none;
            margin: 0;
            padding: 0;
        }
        
        .hidden { display: none !important; }
        
        .btn { 
            padding: 1rem 2rem; 
            font-size: 1.25rem; 
            font-weight: 600;
            background: linear-gradient(135deg, #ef4444, #b91c1c); 
            color: white; 
            border: none; 
            border-radius: 12px; 
            cursor: pointer; 
            margin: 10px; 
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            transition: all 0.2s ease;
        }
        .btn:active { transform: scale(0.95); }
        .btn-alt { background: linear-gradient(135deg, #3b82f6, #1d4ed8); }
        .btn-warning { background: linear-gradient(135deg, #f59e0b, #d97706); }
        
        input { 
            padding: 1rem; 
            font-size: 1.5rem; 
            text-align: center; 
            border-radius: 8px; 
            border: 2px solid #334155;
            background: #1e293b;
            color: white;
            outline: none;
            width: 80%;
            max-width: 300px;
            margin-bottom: 1rem;
        }
        
        #ui-layer {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            pointer-events: none;
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 2rem;
        }

        #healthBar { 
            width: 80%; 
            max-width: 500px;
            height: 40px; 
            border: 3px solid #334155; 
            border-radius: 20px;
            margin: 20px auto; 
            overflow: hidden;
            background: rgba(15, 23, 42, 0.8);
            box-shadow: 0 4px 6px rgba(0,0,0,0.5);
        }
        #healthFill { 
            width: 100%; 
            height: 100%; 
            background: linear-gradient(90deg, #10b981, #34d399); 
            transition: width 0.2s ease-out, background 0.3s; 
        }

        /* 3D Canvas Container */
        #three-container {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: 1;
        }

        .shake { animation: shake 0.5s; }
        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            80% { transform: translate(-1px, -1px) rotate(1deg); }
            100% { transform: translate(1px, -2px) rotate(-1deg); }
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen relative">

    <!-- Main Menu -->
    <div id="menu" class="w-full max-w-md p-8 bg-gray-800 rounded-2xl shadow-2xl z-50">
        <h1 class="text-4xl font-extrabold mb-8 text-transparent bg-clip-text bg-gradient-to-r from-red-400 to-red-600">3D Sword Duel</h1>
        <p class="mb-6 text-gray-400">Choose your role to begin</p>
        <button class="btn w-full mb-4" onclick="initDisplay()">
            📺 Create Game (Display)
        </button>
        <button class="btn btn-alt w-full" onclick="initController()">
            📱 Join as Sword (Phone)
        </button>
    </div>

    <!-- Display UI -->
    <div id="display-ui" class="hidden w-full h-full absolute inset-0 z-20 bg-gray-900 pointer-events-auto flex flex-col items-center justify-center">
        <h2 class="text-3xl font-bold mb-4">Display Mode</h2>
        <p class="text-xl mb-4 text-gray-300">Enter this code on your phone to connect:</p>
        <div class="bg-gray-800 p-8 rounded-xl shadow-inner border border-gray-700">
            <h1 id="game-id" class="text-6xl font-mono font-bold text-yellow-400 tracking-widest">....</h1>
        </div>
        <p class="mt-8 text-gray-500 animate-pulse">Waiting for connection...</p>
    </div>
        
    <!-- The 3D Scene Layer -->
    <div id="three-container" class="hidden"></div>
    
    <!-- Game HUD Layer (Overlays 3D) -->
    <div id="game-ui" class="hidden" style="position: absolute; top:0; left:0; width:100%; height:100%; z-index: 10; pointer-events: none;">
        <div class="w-full text-center mt-10">
            <div id="healthBar"><div id="healthFill"></div></div>
            <h2 id="action-text" class="text-4xl font-bold text-gray-200 drop-shadow-lg h-12">Waiting for swing...</h2>
        </div>
    </div>

    <!-- Controller UI -->
    <div id="controller-ui" class="hidden w-full max-w-md p-6 bg-gray-800 rounded-2xl shadow-2xl z-50 pointer-events-auto relative">
        <div id="connect-screen">
            <h2 class="text-3xl font-bold mb-6 text-blue-400">Sword Controller</h2>
            <p class="mb-4 text-gray-300">Enter the code shown on the display</p>
            <input type="number" id="join-id" placeholder="1234" pattern="\d*" maxlength="4">
            <br>
            <button class="btn btn-alt w-full mt-4" id="connect-btn" onclick="connectToDisplay()">Connect</button>
            <p id="connect-status" class="mt-4 text-sm text-gray-400"></p>
        </div>
        
        <div id="play-screen" class="hidden flex flex-col items-center justify-center h-full">
            <div class="w-24 h-24 bg-green-500 rounded-full flex items-center justify-center mb-6 shadow-[0_0_20px_rgba(34,197,94,0.5)]">
                <svg class="w-12 h-12 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
            </div>
            <h2 class="text-3xl font-bold text-green-400 mb-2">Connected!</h2>
            <p class="text-xl text-gray-300 mb-8 text-center">Grip phone tightly.<br><strong>Camera side is the blade!</strong></p>
            
            <button class="btn w-full mb-4 shadow-lg shadow-red-500/30" onclick="requestMotionPermission()">Enable Sensors (Required for iOS)</button>
            <button class="btn btn-alt w-full mb-4" onclick="recenterSword()">Recenter Sword Calibration</button>
            <button class="btn btn-warning w-full" onclick="manualSwing()">Tap to Swing (Fallback)</button>
        </div>
    </div>

    <script>
        let peer;
        let conn;
        
        // --- DISPLAY LOGIC ---
        let enemyHealth = 100;
        let displayId = '';

        function initDisplay() {
            document.getElementById('menu').classList.add('hidden');
            document.getElementById('display-ui').classList.remove('hidden');
            
            displayId = Math.floor(1000 + Math.random() * 9000).toString();
            peer = new Peer('sword-' + displayId);

            peer.on('open', (id) => {
                document.getElementById('game-id').innerText = displayId;
            });

            peer.on('error', (err) => {
                if (err.type === 'unavailable-id') {
                    alert("ID collision, restarting...");
                    location.reload();
                }
            });

            peer.on('connection', (connection) => {
                conn = connection;
                document.getElementById('display-ui').classList.add('hidden');
                document.getElementById('three-container').classList.remove('hidden');
                document.getElementById('game-ui').classList.remove('hidden');

                initThreeJS(); // Start the 3D world!

                conn.on('data', (data) => {
                    if (data.type === 'swing') {
                        registerHit(data.force);
                    } else if (data.type === 'orient') {
                        updateSwordOrientation(data.alpha, data.beta, data.gamma);
                    } else if (data.type === 'recenter') {
                        baseAlpha = null; 
                    }
                });
                
                conn.on('close', () => {
                    alert('Controller disconnected. Reloading.');
                    location.reload();
                });
            });
        }

        // --- THREE.JS 3D ENGINE ---
        let scene, camera, renderer;
        let swordGroup, enemyGroup;
        let targetRot = { x: 0, y: 0, z: 0 };
        let baseAlpha = null;

        function initThreeJS() {
            const container = document.getElementById('three-container');
            
            // 1. Scene setup
            scene = new THREE.Scene();
            scene.fog = new THREE.Fog(0x0f172a, 10, 30); // Deep blue fog matching background

            // 2. Camera setup
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 1.5, 8); // Look slightly down from eye level

            // 3. Renderer setup
            renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.shadowMap.enabled = true;
            container.appendChild(renderer.domElement);

            // 4. Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
            scene.add(ambientLight);
            
            const dirLight = new THREE.DirectionalLight(0xffffff, 1);
            dirLight.position.set(5, 10, 5);
            dirLight.castShadow = true;
            scene.add(dirLight);

            const redLight = new THREE.PointLight(0xef4444, 0.5, 20);
            redLight.position.set(0, 5, -5);
            scene.add(redLight);

            // 5. Create Sword (Grouped to pivot from the hilt)
            swordGroup = new THREE.Group();
            swordGroup.rotation.order = 'YXZ'; // Important for matching Yaw -> Pitch -> Roll
            
            // Blade (Metallic)
            const bladeGeo = new THREE.BoxGeometry(0.3, 5, 0.08);
            const bladeMat = new THREE.MeshStandardMaterial({ 
                color: 0xe2e8f0, 
                metalness: 0.9, 
                roughness: 0.1 
            });
            const blade = new THREE.Mesh(bladeGeo, bladeMat);
            blade.position.y = 3; // Center of blade is 3 units up
            blade.castShadow = true;
            swordGroup.add(blade);

            // Crossguard (Gold)
            const guardGeo = new THREE.BoxGeometry(1.5, 0.2, 0.3);
            const guardMat = new THREE.MeshStandardMaterial({ 
                color: 0xd4af37, 
                metalness: 0.7, 
                roughness: 0.3 
            });
            const guard = new THREE.Mesh(guardGeo, guardMat);
            guard.position.y = 0.5;
            swordGroup.add(guard);

            // Hilt (Leather/Wood)
            const hiltGeo = new THREE.CylinderGeometry(0.15, 0.15, 1, 16);
            const hiltMat = new THREE.MeshStandardMaterial({ color: 0x5c4033 });
            const hilt = new THREE.Mesh(hiltGeo, hiltMat);
            hilt.position.y = 0; // Hilt is the pivot point!
            swordGroup.add(hilt);

            // Position sword mimicking right hand placement
            swordGroup.position.set(0, -1, 3);
            scene.add(swordGroup);

            // 6. Create Enemy Dummy
            enemyGroup = new THREE.Group();
            
            const dummyMat = new THREE.MeshStandardMaterial({ color: 0x475569 });
            const bodyGeo = new THREE.BoxGeometry(2, 3, 1);
            const body = new THREE.Mesh(bodyGeo, dummyMat);
            body.position.y = 1.5;
            body.castShadow = true;
            enemyGroup.add(body);
            
            const headGeo = new THREE.BoxGeometry(1, 1, 1);
            const head = new THREE.Mesh(headGeo, dummyMat);
            head.position.y = 4;
            head.castShadow = true;
            enemyGroup.add(head);

            // Floor Grid for perspective
            const gridHelper = new THREE.GridHelper(40, 40, 0x334155, 0x1e293b);
            gridHelper.position.y = -2;
            scene.add(gridHelper);

            enemyGroup.position.set(0, -2, -3); // Placed a bit away
            scene.add(enemyGroup);

            window.addEventListener('resize', onWindowResize, false);
            animateThreeJS();
        }

        function onWindowResize() {
            if(camera && renderer) {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            }
        }

        function updateSwordOrientation(alpha, beta, gamma) {
            if (baseAlpha === null && alpha !== null) {
                baseAlpha = alpha;
            }

            // Beta: Pitch (X-axis). 
            // 90 is standing upright. 0 is laying flat (pointing forward into screen).
            let rotX = (beta - 90) * (Math.PI / 180);
            
            // Gamma: Roll/Twist (Z-axis).
            let rotZ = -gamma * (Math.PI / 180);
            
            // Alpha: Yaw (Y-axis). Turn body left/right.
            let rotY = 0;
            if (alpha !== null && baseAlpha !== null) {
                let diff = alpha - baseAlpha;
                if (diff > 180) diff -= 360;
                if (diff < -180) diff += 360;
                rotY = -diff * (Math.PI / 180);
            }

            // Target rotations. We will interpolate towards these in the render loop for smoothness
            targetRot.x = rotX;
            targetRot.y = rotY;
            targetRot.z = rotZ;
        }

        function animateThreeJS() {
            requestAnimationFrame(animateThreeJS);
            
            // Smoothly move the sword towards the target rotation (Lerp)
            // This prevents jittering from the phone's raw sensor data
            swordGroup.rotation.x += (targetRot.x - swordGroup.rotation.x) * 0.3;
            swordGroup.rotation.y += (targetRot.y - swordGroup.rotation.y) * 0.3;
            swordGroup.rotation.z += (targetRot.z - swordGroup.rotation.z) * 0.3;

            renderer.render(scene, camera);
        }

        function flashEnemy3D() {
            // Flash red
            enemyGroup.children.forEach(mesh => {
                mesh.material.color.setHex(0xef4444);
                mesh.material.emissive.setHex(0xaa0000);
            });
            
            // Shake dummy visually
            enemyGroup.rotation.z = (Math.random() - 0.5) * 0.5;
            enemyGroup.rotation.x = (Math.random() - 0.5) * 0.5;

            setTimeout(() => {
                enemyGroup.children.forEach(mesh => {
                    mesh.material.color.setHex(0x475569);
                    mesh.material.emissive.setHex(0x000000);
                });
                enemyGroup.rotation.set(0,0,0);
            }, 150);
        }

        function registerHit(force) {
            if (enemyHealth <= 0) return; 
            
            let damage = Math.floor((force - 10) * 1.5);
            damage = Math.min(45, Math.max(5, damage)); 
            
            enemyHealth = Math.max(0, enemyHealth - damage);
            
            // UI Updates
            const healthFill = document.getElementById('healthFill');
            healthFill.style.width = enemyHealth + '%';
            
            if (enemyHealth < 30) healthFill.style.background = 'linear-gradient(90deg, #ef4444, #f87171)';
            else if (enemyHealth < 60) healthFill.style.background = 'linear-gradient(90deg, #f59e0b, #fbbf24)';
            
            const actionText = document.getElementById('action-text');
            actionText.innerText = `HIT! -${damage} DMG`;
            actionText.style.color = '#ef4444';
            
            // Visual Effects
            document.body.classList.add('shake');
            flashEnemy3D();
            playHitSound();

            setTimeout(() => {
                document.body.classList.remove('shake');
                if (enemyHealth > 0) {
                    actionText.innerText = "Ready..."; 
                    actionText.style.color = '#e2e8f0';
                }
            }, 150);

            if (enemyHealth <= 0) {
                actionText.innerText = "ENEMY DESTROYED!";
                actionText.style.color = '#10b981';
                
                // Fall over animation for 3D enemy
                let fallInterval = setInterval(() => {
                    enemyGroup.rotation.x -= 0.1;
                    if(enemyGroup.rotation.x <= -Math.PI/2) clearInterval(fallInterval);
                }, 16);

                playDeathSound();

                setTimeout(() => { 
                    enemyHealth = 100; 
                    healthFill.style.width = '100%'; 
                    healthFill.style.background = 'linear-gradient(90deg, #10b981, #34d399)';
                    actionText.innerText = "New Enemy Approaches...";
                    actionText.style.color = '#e2e8f0';
                    
                    enemyGroup.rotation.set(0,0,0); // Stand back up
                }, 3000);
            }
        }

        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx;

        function initAudio() {
            if (!audioCtx) audioCtx = new AudioContext();
        }

        function playHitSound() {
            initAudio();
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            oscillator.type = 'sawtooth';
            oscillator.frequency.setValueAtTime(250, audioCtx.currentTime);
            oscillator.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.15);
            
            gainNode.gain.setValueAtTime(0.6, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
            
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            oscillator.start();
            oscillator.stop(audioCtx.currentTime + 0.15);
        }

        function playDeathSound() {
            initAudio();
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            oscillator.type = 'square';
            oscillator.frequency.setValueAtTime(100, audioCtx.currentTime);
            oscillator.frequency.exponentialRampToValueAtTime(5, audioCtx.currentTime + 0.8);
            
            gainNode.gain.setValueAtTime(0.7, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.8);
            
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            oscillator.start();
            oscillator.stop(audioCtx.currentTime + 0.8);
        }

        // --- CONTROLLER LOGIC ---

        function initController() {
            document.getElementById('menu').classList.add('hidden');
            document.getElementById('controller-ui').classList.remove('hidden');
            peer = new Peer();
            
            peer.on('error', (err) => {
                const status = document.getElementById('connect-status');
                status.innerText = "Connection error. Check ID.";
                status.classList.add('text-red-400');
                document.getElementById('connect-btn').disabled = false;
            });
        }

        function connectToDisplay() {
            const idInput = document.getElementById('join-id').value;
            if (!idInput) return alert("Please enter a game ID");
            
            const targetId = 'sword-' + idInput;
            const status = document.getElementById('connect-status');
            
            document.getElementById('connect-btn').disabled = true;
            status.innerText = "Connecting...";
            status.classList.remove('text-red-400');
            status.classList.add('text-yellow-400');

            conn = peer.connect(targetId, { reliable: false });
            
            conn.on('open', () => {
                document.getElementById('connect-screen').classList.add('hidden');
                document.getElementById('play-screen').classList.remove('hidden');
                setupMotion();
            });
        }

        let lastSwingTime = 0;
        const SWING_THRESHOLD = 18; 
        const SWING_COOLDOWN = 500; 
        
        let orientInterval = null;
        let currentAlpha = 0, currentBeta = 90, currentGamma = 0;

        function setupMotion() {
            if (window.DeviceMotionEvent) {
                window.addEventListener('devicemotion', handleMotion, false);
            } 
            
            if (window.DeviceOrientationEvent) {
                window.addEventListener('deviceorientation', handleOrientation, false);
                
                // Stream orientation at 30fps
                if (orientInterval) clearInterval(orientInterval);
                orientInterval = setInterval(() => {
                    if (conn && conn.open) {
                        conn.send({ 
                            type: 'orient', 
                            alpha: currentAlpha, 
                            beta: currentBeta, 
                            gamma: currentGamma 
                        });
                    }
                }, 33);
            }
        }

        function handleOrientation(event) {
            currentAlpha = event.alpha;
            currentBeta = event.beta;
            currentGamma = event.gamma;
        }

        function handleMotion(event) {
            if (!event.acceleration) return;
            
            let forceX = Math.abs(event.acceleration.x || 0);
            let forceY = Math.abs(event.acceleration.y || 0);
            let forceZ = Math.abs(event.acceleration.z || 0);
            
            let totalForce = forceX + forceY + forceZ;

            if (totalForce > SWING_THRESHOLD) {
                const now = Date.now();
                if (now - lastSwingTime > SWING_COOLDOWN) {
                    if (conn && conn.open) {
                        conn.send({ type: 'swing', force: totalForce });
                        if (navigator.vibrate) navigator.vibrate(100); 
                    }
                    lastSwingTime = now;
                }
            }
        }

        function requestMotionPermission() {
            let motionGranted = false;
            let orientGranted = false;

            const checkReady = () => {
                if (motionGranted || orientGranted) {
                    alert("Sensors active! Ready to swing.");
                    setupMotion();
                }
            };

            if (typeof DeviceMotionEvent.requestPermission === 'function') {
                DeviceMotionEvent.requestPermission()
                    .then(permissionState => {
                        if (permissionState === 'granted') motionGranted = true;
                        
                        if (typeof DeviceOrientationEvent.requestPermission === 'function') {
                            DeviceOrientationEvent.requestPermission().then(state => {
                                if (state === 'granted') orientGranted = true;
                                checkReady();
                            });
                        } else {
                            orientGranted = true;
                            checkReady();
                        }
                    })
                    .catch(console.error);
            } else {
                alert("Sensors should be active. Just swing!");
                setupMotion();
            }
        }

        function recenterSword() {
            if (conn && conn.open) conn.send({ type: 'recenter' });
        }

        function manualSwing() {
            if (conn && conn.open) {
                const simulatedForce = 20 + Math.random() * 20;
                conn.send({ type: 'swing', force: simulatedForce });
                if (navigator.vibrate) navigator.vibrate(50); 
            }
        }
    </script>
</body>
</html>
