<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>J.A.R.V.I.S. // Tactical Interface</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Rajdhani:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-deep: #0b0c10;
      --bg-radial: #141720;
      --grid-line: rgba(255, 255, 255, 0.038);
      --cyan-bright: #5ce1ff;
      --cyan-core: #22b8ff;
      --cyan-deep: #0077ff;
      --cyan-glow: rgba(34, 184, 255, 0.45);
      --text-main: rgba(255, 255, 255, 0.92);
      --text-dim: rgba(255, 255, 255, 0.45);
      --glass-bg: rgba(14, 17, 24, 0.84);
      --glass-border: rgba(92, 225, 255, 0.22);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-font-smoothing: antialiased;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at 50% 50%, var(--bg-radial) 0%, var(--bg-deep) 80%);
      color: var(--text-main);
      font-family: 'Inter', sans-serif;
      position: relative;
    }

    /* Architectural Grid Background */
    .grid-layer {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(to right, var(--grid-line) 1px, transparent 1px),
        linear-gradient(to bottom, var(--grid-line) 1px, transparent 1px);
      background-size: 46px 46px;
      background-position: center center;
      pointer-events: none;
      z-index: 1;
    }

    /* Subtle Vignette */
    .grid-layer::after {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 50%, transparent 35%, rgba(6, 7, 10, 0.68) 100%);
    }

    /* Top Calibration Ticks */
    .top-ticks {
      position: absolute;
      top: 46px;
      left: 50%;
      transform: translateX(-50%);
      width: min(88vw, 740px);
      height: 6px;
      background-image: linear-gradient(to right, rgba(255, 255, 255, 0.18) 1px, transparent 1px);
      background-size: 46px 100%;
      pointer-events: none;
      z-index: 2;
    }

    /* Top HUD Bracket */
    .top-hud {
      position: absolute;
      top: 18px;
      left: 50%;
      transform: translateX(-50%);
      width: min(72vw, 440px);
      height: 28px;
      z-index: 3;
      pointer-events: none;
      opacity: 0.75;
    }

    /* 50% Transparent Gear (ฟันเฟือง) Config Button */
    .config-btn {
      position: fixed;
      top: 22px;
      right: 26px;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.14);
      color: #ffffff;
      opacity: 0.5;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 30;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      transition: opacity 0.25s ease, transform 0.35s cubic-bezier(0.22, 1, 0.36, 1), border-color 0.25s ease, box-shadow 0.25s ease;
    }

    .config-btn:hover {
      opacity: 0.95;
      border-color: var(--cyan-bright);
      box-shadow: 0 0 16px rgba(92, 225, 255, 0.32);
      transform: rotate(60deg);
    }

    .config-btn svg {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      stroke-width: 1.7;
      fill: none;
    }

    .status-dot {
      position: absolute;
      top: 5px;
      right: 5px;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #ff4d4d;
      box-shadow: 0 0 6px #ff4d4d;
      transition: background 0.3s ease, box-shadow 0.3s ease;
    }

    .status-dot.connected {
      background: #00f59b;
      box-shadow: 0 0 8px #00f59b;
    }

    /* Center JARVIS Core Container */
    .core-stage {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 5;
      pointer-events: none;
    }

    .jarvis-orb {
      position: relative;
      width: 380px;
      height: 380px;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: auto;
      cursor: pointer;
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .jarvis-orb:active {
      transform: scale(0.97);
    }

    /* Ambient cyan glow behind core */
    .core-bloom {
      position: absolute;
      width: 210px;
      height: 210px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(34, 184, 255, 0.32) 0%, rgba(0, 119, 255, 0.12) 48%, transparent 72%);
      filter: blur(18px);
      transition: transform 0.06s linear, opacity 0.2s ease;
      pointer-events: none;
    }

    /* Dark hollow inner sphere */
    .core-void {
      position: absolute;
      width: 152px;
      height: 152px;
      border-radius: 50%;
      background: radial-gradient(circle at 50% 50%, #050608 55%, #0d1624 88%, #1f8fff 100%);
      box-shadow:
        0 0 22px rgba(34, 184, 255, 0.65),
        0 0 50px rgba(0, 140, 255, 0.28),
        inset 0 0 24px rgba(34, 184, 255, 0.45);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 4;
      transition: transform 0.06s linear, box-shadow 0.1s linear;
    }

    /* Sharp neon ring border */
    .core-void::before {
      content: "";
      position: absolute;
      inset: -2px;
      border-radius: 50%;
      border: 1.8px solid rgba(155, 238, 255, 0.9);
      box-shadow: 0 0 12px var(--cyan-core);
      pointer-events: none;
    }

    .jarvis-title {
      font-family: 'Rajdhani', sans-serif;
      font-weight: 500;
      font-size: 1.38rem;
      letter-spacing: 0.34em;
      padding-left: 0.34em;
      color: #ffffff;
      text-shadow: 0 0 12px rgba(255, 255, 255, 0.45);
      z-index: 6;
    }

    /* SVG HUD Rings */
    .hud-svg {
      position: absolute;
      width: 380px;
      height: 380px;
      z-index: 5;
      pointer-events: none;
      overflow: visible;
    }

    .rot-cw-slow {
      transform-origin: 190px 190px;
      animation: spinCW 28s linear infinite;
    }

    .rot-ccw-med {
      transform-origin: 190px 190px;
      animation: spinCCW 18s linear infinite;
    }

    .rot-cw-fast {
      transform-origin: 190px 190px;
      animation: spinCW 11s linear infinite;
    }

    @keyframes spinCW {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @keyframes spinCCW {
      from { transform: rotate(360deg); }
      to { transform: rotate(0deg); }
    }

    /* Subtle subtitle state indicator */
    .state-readout {
      position: absolute;
      top: calc(50% + 150px);
      left: 50%;
      transform: translateX(-50%);
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.68rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: rgba(155, 238, 255, 0.55);
      z-index: 6;
      pointer-events: none;
      text-align: center;
      white-space: nowrap;
      transition: opacity 0.25s ease, color 0.25s ease;
    }

    /* Command Input Bar (Toggleable via Chat icon or clicking orb) */
    .command-bar-wrap {
      position: fixed;
      bottom: 86px;
      left: 50%;
      transform: translateX(-50%) translateY(12px);
      width: min(90vw, 460px);
      z-index: 20;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease, transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .command-bar-wrap.active {
      opacity: 1;
      pointer-events: auto;
      transform: translateX(-50%) translateY(0);
    }

    .command-form {
      display: flex;
      align-items: center;
      background: rgba(12, 15, 22, 0.85);
      border: 1px solid rgba(92, 225, 255, 0.26);
      border-radius: 999px;
      padding: 6px 8px 6px 18px;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: 0 10px 32px rgba(0, 0, 0, 0.55), 0 0 20px rgba(34, 184, 255, 0.12);
    }

    .command-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #fff;
      font-family: 'Inter', sans-serif;
      font-size: 0.86rem;
      letter-spacing: 0.02em;
      user-select: text;
    }

    .command-input::placeholder {
      color: rgba(255, 255, 255, 0.34);
    }

    .command-send {
      background: rgba(92, 225, 255, 0.14);
      border: 1px solid rgba(92, 225, 255, 0.38);
      color: var(--cyan-bright);
      border-radius: 999px;
      padding: 7px 15px;
      font-family: 'Rajdhani', sans-serif;
      font-weight: 600;
      font-size: 0.78rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .command-send:hover:not(:disabled) {
      background: rgba(92, 225, 255, 0.28);
      box-shadow: 0 0 12px rgba(92, 225, 255, 0.35);
    }

    .command-send:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    /* Bottom Control Dock matching reference */
    .bottom-dock {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      z-index: 15;
    }

    .dock-icons {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .dock-btn {
      background: transparent;
      border: none;
      color: rgba(255, 255, 255, 0.55);
      cursor: pointer;
      padding: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.2s ease, transform 0.2s ease, filter 0.2s ease;
    }

    .dock-btn:hover, .dock-btn.active {
      color: #ffffff;
      filter: drop-shadow(0 0 6px var(--cyan-bright));
      transform: translateY(-1px);
    }

    .dock-btn svg {
      width: 15px;
      height: 15px;
      stroke: currentColor;
      stroke-width: 1.6;
      fill: none;
    }

    .dock-divider {
      width: 1px;
      height: 12px;
      background: rgba(255, 255, 255, 0.16);
    }

    .dock-pagination {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .dot-sm {
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.35);
    }

    .dot-pill {
      width: 12px;
      height: 3px;
      border-radius: 99px;
      background: rgba(255, 255, 255, 0.85);
      box-shadow: 0 0 6px rgba(255, 255, 255, 0.5);
    }

    /* Glassmorphic Config Modal for ElevenLabs */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(4, 6, 10, 0.68);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 50;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }

    .modal-backdrop.open {
      opacity: 1;
      pointer-events: auto;
    }

    .config-modal {
      width: min(92vw, 430px);
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: 14px;
      padding: 24px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.78), 0 0 32px rgba(34, 184, 255, 0.1);
      transform: translateY(10px) scale(0.98);
      transition: transform 0.28s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .modal-backdrop.open .config-modal {
      transform: translateY(0) scale(1);
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .modal-title {
      font-family: 'Rajdhani', sans-serif;
      font-size: 1.05rem;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--cyan-bright);
    }

    .modal-close {
      background: transparent;
      border: none;
      color: var(--text-dim);
      cursor: pointer;
      font-size: 1.2rem;
      line-height: 1;
      padding: 4px;
      transition: color 0.2s;
    }

    .modal-close:hover {
      color: #fff;
    }

    .field-group {
      margin-bottom: 15px;
    }

    .field-label {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.7rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.7);
      margin-bottom: 6px;
    }

    .field-label span.opt {
      color: rgba(92, 225, 255, 0.65);
      font-size: 0.62rem;
    }

    .input-with-toggle {
      position: relative;
      display: flex;
      align-items: center;
    }

    .field-input, .field-select {
      width: 100%;
      background: rgba(6, 8, 12, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 8px;
      padding: 10px 12px;
      color: #fff;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.78rem;
      outline: none;
      user-select: text;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .input-with-toggle .field-input {
      padding-right: 54px;
    }

    .toggle-vis-btn {
      position: absolute;
      right: 8px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: rgba(255, 255, 255, 0.6);
      border-radius: 5px;
      padding: 3px 7px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.62rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .toggle-vis-btn:hover {
      color: #fff;
      border-color: rgba(92, 225, 255, 0.4);
    }

    .field-input:focus, .field-select:focus {
      border-color: var(--cyan-bright);
      box-shadow: 0 0 12px rgba(92, 225, 255, 0.2);
    }

    .field-hint {
      font-size: 0.7rem;
      color: rgba(255, 255, 255, 0.38);
      margin-top: 5px;
      line-height: 1.38;
    }

    .preset-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 7px;
    }

    .preset-chip {
      background: rgba(92, 225, 255, 0.07);
      border: 1px solid rgba(92, 225, 255, 0.22);
      color: rgba(255, 255, 255, 0.75);
      border-radius: 6px;
      padding: 3px 8px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.64rem;
      cursor: pointer;
      transition: all 0.18s ease;
    }

    .preset-chip:hover {
      background: rgba(92, 225, 255, 0.18);
      border-color: var(--cyan-bright);
      color: #fff;
    }

    .modal-actions {
      display: flex;
      gap: 10px;
      margin-top: 22px;
    }

    .btn-secondary, .btn-primary {
      flex: 1;
      padding: 10px 14px;
      border-radius: 8px;
      font-family: 'Rajdhani', sans-serif;
      font-weight: 600;
      font-size: 0.85rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.14);
      color: rgba(255, 255, 255, 0.82);
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
    }

    .btn-primary {
      background: linear-gradient(135deg, rgba(34, 184, 255, 0.25), rgba(0, 119, 255, 0.38));
      border: 1px solid rgba(92, 225, 255, 0.55);
      color: #fff;
      box-shadow: 0 0 16px rgba(34, 184, 255, 0.22);
    }

    .btn-primary:hover {
      background: linear-gradient(135deg, rgba(34, 184, 255, 0.42), rgba(0, 119, 255, 0.52));
      box-shadow: 0 0 22px rgba(92, 225, 255, 0.42);
    }
  </style>
</head>
<body>

  <!-- Architectural Grid & Top Ticks -->
  <div class="grid-layer"></div>
  <div class="top-ticks"></div>

  <!-- Top HUD Bracket Line -->
  <svg class="top-hud" viewBox="0 0 440 28" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M 10 4 L 130 4 L 148 20 L 292 20 L 310 4 L 430 4" stroke="rgba(255,255,255,0.55)" stroke-width="1.2" stroke-linecap="round"/>
  </svg>

  <!-- 50% Transparent Gear (ฟันเฟือง) Button -->
  <button class="config-btn" id="configBtn" title="ElevenLabs API Configuration" aria-label="Configure ElevenLabs API">
    <span class="status-dot" id="apiStatusDot"></span>
    <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="3"></circle>
      <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
    </svg>
  </button>

  <!-- Central J.A.R.V.I.S. Core -->
  <div class="core-stage">
    <div class="jarvis-orb" id="jarvisOrb" title="Click to transmit speech via ElevenLabs">
      <div class="core-bloom" id="coreBloom"></div>

      <!-- Precision Vector HUD Overlay -->
      <svg class="hud-svg" viewBox="0 0 380 380" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <filter id="cyanGlow" x="-30%" y="-30%" width="160%" height="160%">
            <feGaussianBlur stdDeviation="3.5" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
          </filter>
        </defs>

        <!-- Outer Fine Dotted Ring (Radius 142) -->
        <g class="rot-cw-slow" id="outerDotRing">
          <circle cx="190" cy="190" r="142" fill="none" stroke="rgba(255,255,255,0.45)" stroke-width="1.5" stroke-dasharray="1 14.86" stroke-linecap="round" />
          <circle cx="190" cy="190" r="158" fill="none" stroke="rgba(92,225,255,0.22)" stroke-width="1" stroke-dasharray="0.8 24.8" stroke-linecap="round" />
        </g>

        <!-- Middle Segmented Arcs (Radius 112 & 103) -->
        <g class="rot-ccw-med" id="midArcRing">
          <!-- Thin structural ring -->
          <circle cx="190" cy="190" r="103" fill="none" stroke="rgba(92,225,255,0.22)" stroke-width="1" />
          <!-- High-contrast outer white-cyan arc (Bottom-Left) -->
          <path d="M 79.5 208 A 112 112 0 0 0 92 246" fill="none" stroke="#ffffff" stroke-width="3.2" stroke-linecap="round" filter="url(#cyanGlow)" />
          <!-- Secondary swept arc (Bottom) -->
          <path d="M 103 255 A 104 104 0 0 0 218 290" fill="none" stroke="rgba(165, 240, 255, 0.75)" stroke-width="1.6" stroke-linecap="round" />
          <!-- Top-right subtle telemetry arc -->
          <path d="M 255 106 A 106 106 0 0 1 294 176" fill="none" stroke="rgba(92, 225, 255, 0.45)" stroke-width="1.3" stroke-dasharray="6 4" />
        </g>

        <!-- Inner High-Luminance Accent Arcs (Radius 82 & 88) -->
        <g class="rot-cw-fast" id="innerArcRing">
          <circle cx="190" cy="190" r="85" fill="none" stroke="rgba(34, 184, 255, 0.5)" stroke-width="1.4" />
          <!-- Top-left bright white-cyan highlight arc -->
          <path d="M 122 146 A 81 81 0 0 1 186 109" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" filter="url(#cyanGlow)" />
          <!-- Bottom-right balance arc -->
          <path d="M 248 246 A 81 81 0 0 1 194 271" fill="none" stroke="rgba(92, 225, 255, 0.85)" stroke-width="2" stroke-linecap="round" />
        </g>

        <!-- Micro HUD Crosshair Ticks -->
        <g stroke="rgba(255,255,255,0.28)" stroke-width="1">
          <line x1="190" y1="22" x2="190" y2="27" />
          <line x1="190" y1="353" x2="190" y2="358" />
          <line x1="22" y1="190" x2="27" y2="190" />
          <line x1="353" y1="190" x2="358" y2="190" />
        </g>
      </svg>

      <!-- Center Black Sphere + JARVIS Typography -->
      <div class="core-void" id="coreVoid">
        <span class="jarvis-title">JARVIS</span>
      </div>
    </div>

    <div class="state-readout" id="stateReadout">STANDBY // TAP ORB TO SPEAK</div>
  </div>

  <!-- Interactive ElevenLabs TTS Command Bar -->
  <div class="command-bar-wrap" id="commandBar">
    <form class="command-form" id="ttsForm">
      <input
        type="text"
        class="command-input"
        id="ttsInput"
        placeholder="Enter command for J.A.R.V.I.S. to speak via ElevenLabs..."
        autocomplete="off"
      />
      <button type="submit" class="command-send" id="ttsSendBtn">Speak</button>
    </form>
  </div>

  <!-- Minimal Bottom Dock (Matching Reference) -->
  <div class="bottom-dock">
    <div class="dock-icons">
      <!-- Mute / Stop Audio Toggle -->
      <button class="dock-btn" id="btnMute" title="Mute / Stop Audio">
        <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="9"></circle>
          <line x1="9" y1="9" x2="15" y2="15"></line>
          <line x1="15" y1="9" x2="9" y2="15"></line>
        </svg>
      </button>
      <div class="dock-divider"></div>
      <!-- Command Input Toggle -->
      <button class="dock-btn" id="btnPrompt" title="Toggle Text Command Bar">
        <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
        </svg>
      </button>
      <div class="dock-divider"></div>
      <!-- Voice Input (Browser Speech Recognition -> ElevenLabs TTS) -->
      <button class="dock-btn" id="btnMic" title="Voice Input">
        <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="6" width="14" height="12" rx="2"></rect>
          <polygon points="22 8 16 12 22 16 22 8"></polygon>
        </svg>
      </button>
      <div class="dock-divider"></div>
      <!-- Quick Test Audio -->
      <button class="dock-btn" id="btnTestAudio" title="Synthesize Diagnostic Greeting">
        <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 18V5l12-2v13"></path>
          <circle cx="6" cy="18" r="3"></circle>
          <circle cx="18" cy="16" r="3"></circle>
        </svg>
      </button>
    </div>
    <div class="dock-pagination">
      <span class="dot-sm"></span>
      <span class="dot-pill"></span>
      <span class="dot-sm"></span>
    </div>
  </div>

  <!-- ElevenLabs API Configuration Modal -->
  <div class="modal-backdrop" id="configModal">
    <div class="config-modal">
      <div class="modal-header">
        <div class="modal-title">ElevenLabs // Neural Voice Link</div>
        <button class="modal-close" id="closeModalBtn" aria-label="Close">&times;</button>
      </div>

      <div class="field-group">
        <label class="field-label" for="elevenApiKey">
          <span>ElevenLabs API Key</span>
          <span class="opt">XI-API-KEY</span>
        </label>
        <div class="input-with-toggle">
          <input
            type="password"
            class="field-input"
            id="elevenApiKey"
            placeholder="sk_..."
            autocomplete="off"
            spellcheck="false"
          />
          <button type="button" class="toggle-vis-btn" id="toggleKeyVis">SHOW</button>
        </div>
        <div class="field-hint">Saved locally in your browser. Sent directly to <code>api.elevenlabs.io</code> via the <code>xi-api-key</code> header.</div>
      </div>

      <div class="field-group">
        <label class="field-label" for="elevenVoiceId">
          <span>ElevenLabs Voice ID</span>
          <span class="opt">VOICE_ID</span>
        </label>
        <input
          type="text"
          class="field-input"
          id="elevenVoiceId"
          placeholder="e.g. JBFqnCBsd6RMkjVDRZzb"
          autocomplete="off"
          spellcheck="false"
        />
        <div class="preset-chips">
          <button type="button" class="preset-chip" data-voice="JBFqnCBsd6RMkjVDRZzb">George (British)</button>
          <button type="button" class="preset-chip" data-voice="onwK4e9ZLuTAKqWW03F9">Daniel (British)</button>
          <button type="button" class="preset-chip" data-voice="N2lVS1w4EtoT3dr4eOWO">Callum</button>
          <button type="button" class="preset-chip" data-voice="pNInz6obpgDQGcFmaJgB">Adam</button>
        </div>
        <div class="field-hint">Paste any custom or cloned ElevenLabs Voice ID, or click a preset above.</div>
      </div>

      <div class="field-group">
        <label class="field-label" for="elevenModel">
          <span>Synthesis Model</span>
          <span class="opt">MODEL_ID</span>
        </label>
        <select class="field-select" id="elevenModel">
          <option value="eleven_flash_v2_5">eleven_flash_v2_5 (Ultra-Fast 75ms Latency)</option>
          <option value="eleven_turbo_v2_5">eleven_turbo_v2_5 (Balanced High Quality)</option>
          <option value="eleven_multilingual_v2">eleven_multilingual_v2 (Rich Expressive / 29 Languages)</option>
        </select>
      </div>

      <div class="modal-actions">
        <button type="button" class="btn-secondary" id="testKeyBtn">Test Voice</button>
        <button type="button" class="btn-primary" id="saveKeyBtn">Save Config</button>
      </div>
    </div>
  </div>

  <script>
    // --- DOM Elements ---
    const configBtn = document.getElementById('configBtn');
    const configModal = document.getElementById('configModal');
    const closeModalBtn = document.getElementById('closeModalBtn');
    const saveKeyBtn = document.getElementById('saveKeyBtn');
    const testKeyBtn = document.getElementById('testKeyBtn');
    const toggleKeyVis = document.getElementById('toggleKeyVis');
    const apiStatusDot = document.getElementById('apiStatusDot');

    const elevenApiKeyInput = document.getElementById('elevenApiKey');
    const elevenVoiceIdInput = document.getElementById('elevenVoiceId');
    const elevenModelInput = document.getElementById('elevenModel');
    const presetChips = document.querySelectorAll('.preset-chip');

    const jarvisOrb = document.getElementById('jarvisOrb');
    const coreVoid = document.getElementById('coreVoid');
    const coreBloom = document.getElementById('coreBloom');
    const outerDotRing = document.getElementById('outerDotRing');
    const stateReadout = document.getElementById('stateReadout');

    const commandBar = document.getElementById('commandBar');
    const ttsForm = document.getElementById('ttsForm');
    const ttsInput = document.getElementById('ttsInput');
    const ttsSendBtn = document.getElementById('ttsSendBtn');
    const btnPrompt = document.getElementById('btnPrompt');
    const btnTestAudio = document.getElementById('btnTestAudio');
    const btnMute = document.getElementById('btnMute');
    const btnMic = document.getElementById('btnMic');

    // --- Default & Persisted State ---
    const STORAGE_KEY = 'JARVIS_ELEVENLABS_CONFIG_V2';
    const DEFAULT_VOICE_ID = 'JBFqnCBsd6RMkjVDRZzb'; // George (Clean British J.A.R.V.I.S.-style voice)
    const DEFAULT_MODEL_ID = 'eleven_flash_v2_5';

    let isMuted = false;
    let isSynthesizing = false;
    let audioCtx = null;
    let analyser = null;
    let activeSource = null;
    let animFrameId = null;

    function loadConfig() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) {
          return {
            apiKey: '',
            voiceId: DEFAULT_VOICE_ID,
            modelId: DEFAULT_MODEL_ID
          };
        }
        const parsed = JSON.parse(raw);
        return {
          apiKey: (parsed.apiKey || '').trim(),
          voiceId: (parsed.voiceId || DEFAULT_VOICE_ID).trim(),
          modelId: parsed.modelId || DEFAULT_MODEL_ID
        };
      } catch (e) {
        return {
          apiKey: '',
          voiceId: DEFAULT_VOICE_ID,
          modelId: DEFAULT_MODEL_ID
        };
      }
    }

    function saveConfig(cfg) {
      const cleanConfig = {
        apiKey: (cfg.apiKey || '').trim(),
        voiceId: (cfg.voiceId || DEFAULT_VOICE_ID).trim(),
        modelId: cfg.modelId || DEFAULT_MODEL_ID
      };
      localStorage.setItem(STORAGE_KEY, JSON.stringify(cleanConfig));
      updateStatusIndicator();
      return cleanConfig;
    }

    function updateStatusIndicator() {
      const { apiKey, voiceId } = loadConfig();
      if (apiKey.length > 8 && voiceId.length > 5) {
        apiStatusDot.classList.add('connected');
      } else {
        apiStatusDot.classList.remove('connected');
      }
    }

    function setReadout(text, isAlert = false) {
      stateReadout.textContent = text;
      stateReadout.style.color = isAlert
        ? 'rgba(255, 107, 107, 0.9)'
        : 'rgba(155, 238, 255, 0.62)';
    }

    // --- Modal Logic ---
    function syncModalInputs() {
      const cfg = loadConfig();
      elevenApiKeyInput.value = cfg.apiKey;
      elevenVoiceIdInput.value = cfg.voiceId;
      elevenModelInput.value = cfg.modelId;
      updateStatusIndicator();
    }

    configBtn.addEventListener('click', () => {
      syncModalInputs();
      configModal.classList.add('open');
    });

    closeModalBtn.addEventListener('click', () => {
      configModal.classList.remove('open');
    });

    configModal.addEventListener('click', (e) => {
      if (e.target === configModal) {
        configModal.classList.remove('open');
      }
    });

    toggleKeyVis.addEventListener('click', () => {
      const isPassword = elevenApiKeyInput.type === 'password';
      elevenApiKeyInput.type = isPassword ? 'text' : 'password';
      toggleKeyVis.textContent = isPassword ? 'HIDE' : 'SHOW';
    });

    presetChips.forEach((chip) => {
      chip.addEventListener('click', () => {
        elevenVoiceIdInput.value = chip.getAttribute('data-voice');
      });
    });

    saveKeyBtn.addEventListener('click', () => {
      const saved = saveConfig({
        apiKey: elevenApiKeyInput.value,
        voiceId: elevenVoiceIdInput.value,
        modelId: elevenModelInput.value
      });
      configModal.classList.remove('open');
      if (saved.apiKey) {
        setReadout('ELEVENLABS LINKED // VOICE ID READY');
      } else {
        setReadout('API KEY EMPTY // TAP GEAR ICON', true);
      }
    });

    testKeyBtn.addEventListener('click', async () => {
      // Unlock Web Audio Context directly inside user gesture
      ensureAudioContext();
      saveConfig({
        apiKey: elevenApiKeyInput.value,
        voiceId: elevenVoiceIdInput.value,
        modelId: elevenModelInput.value
      });
      configModal.classList.remove('open');
      await speakWithElevenLabs('All systems operational, sir. ElevenLabs neural voice interface online.');
    });

    // --- Web Audio API Initialization & Visualizer ---
    function ensureAudioContext() {
      if (!audioCtx) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContextClass();
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 256;
        analyser.smoothingTimeConstant = 0.78;
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function stopCurrentAudio() {
      if (activeSource) {
        try {
          activeSource.onended = null;
          activeSource.stop();
          activeSource.disconnect();
        } catch (_) {}
        activeSource = null;
      }
      if (animFrameId) {
        cancelAnimationFrame(animFrameId);
        animFrameId = null;
      }
      resetCoreVisuals();
    }

    function resetCoreVisuals() {
      coreVoid.style.transform = 'scale(1)';
      coreVoid.style.boxShadow = `
        0 0 22px rgba(34, 184, 255, 0.65),
        0 0 50px rgba(0, 140, 255, 0.28),
        inset 0 0 24px rgba(34, 184, 255, 0.45)
      `;
      coreBloom.style.transform = 'scale(1)';
      outerDotRing.style.opacity = '1';
    }

    // --- ElevenLabs Text-to-Speech API Integration ---
    async function speakWithElevenLabs(text) {
      const cleanText = (text || '').trim();
      if (!cleanText || isSynthesizing) return;

      if (isMuted) {
        setReadout('AUDIO MUTED // UNMUTE IN BOTTOM DOCK', true);
        return;
      }

      const { apiKey, voiceId, modelId } = loadConfig();
      if (!apiKey) {
        setReadout('MISSING ELEVENLABS KEY // TAP GEAR ICON', true);
        syncModalInputs();
        configModal.classList.add('open');
        return;
      }

      const targetVoiceId = voiceId || DEFAULT_VOICE_ID;

      // Unlock AudioContext immediately on trigger
      ensureAudioContext();
      stopCurrentAudio();

      isSynthesizing = true;
      ttsSendBtn.disabled = true;
      setReadout('SYNTHESIZING // ELEVENLABS STREAM...');

      const endpoint = `https://api.elevenlabs.io/v1/text-to-speech/${encodeURIComponent(targetVoiceId)}?output_format=mp3_44100_128`;

      const payload = {
        text: cleanText,
        model_id: modelId || DEFAULT_MODEL_ID,
        voice_settings: {
          stability: 0.50,
          similarity_boost: 0.78,
          style: 0.0,
          use_speaker_boost: true
        }
      };

      try {
        const response = await fetch(endpoint, {
          method: 'POST',
          headers: {
            'xi-api-key': apiKey,
            'Content-Type': 'application/json',
            'Accept': 'audio/mpeg'
          },
          body: JSON.stringify(payload)
        });

        if (!response.ok) {
          let errDetail = `HTTP ${response.status}`;
          try {
            const errData = await response.json();
            if (errData?.detail?.message) {
              errDetail = errData.detail.message;
            } else if (typeof errData?.detail === 'string') {
              errDetail = errData.detail;
            }
          } catch (_) {}
          throw new Error(errDetail);
        }

        const arrayBuffer = await response.arrayBuffer();
        const audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);

        playDecodedBuffer(audioBuffer);
      } catch (err) {
        console.error('ElevenLabs TTS Error:', err);
        const msg = (err.message || 'REQUEST FAILED').toUpperCase().slice(0, 44);
        setReadout(`ELEVENLABS ERROR // ${msg}`, true);
      } finally {
        isSynthesizing = false;
        ttsSendBtn.disabled = false;
      }
    }

    // Plays decoded AudioBuffer directly through Web Audio API (avoids CORS/MediaElement issues)
    function playDecodedBuffer(audioBuffer) {
      stopCurrentAudio();

      const source = audioCtx.createBufferSource();
      source.buffer = audioBuffer;
      source.connect(analyser);
      analyser.connect(audioCtx.destination);

      activeSource = source;
      const freqData = new Uint8Array(analyser.frequencyBinCount);

      function renderPulse() {
        if (!activeSource) return;

        analyser.getByteFrequencyData(freqData);
        let sum = 0;
        const sampleBins = 32;
        for (let i = 0; i < sampleBins; i++) {
          sum += freqData[i];
        }
        const avg = sum / sampleBins;
        const norm = Math.min(1, avg / 210); // 0.0 -> 1.0

        const voidScale = 1 + norm * 0.15;
        const bloomScale = 1 + norm * 0.5;
        const glowRadius = 22 + norm * 48;

        coreVoid.style.transform = `scale(${voidScale.toFixed(3)})`;
        coreVoid.style.boxShadow = `
          0 0 ${glowRadius.toFixed(1)}px rgba(92, 225, 255, ${(0.65 + norm * 0.35).toFixed(2)}),
          0 0 ${(glowRadius * 2).toFixed(1)}px rgba(0, 140, 255, ${(0.28 + norm * 0.38).toFixed(2)}),
          inset 0 0 ${(24 + norm * 24).toFixed(1)}px rgba(92, 225, 255, ${(0.45 + norm * 0.45).toFixed(2)})
        `;
        coreBloom.style.transform = `scale(${bloomScale.toFixed(3)})`;

        animFrameId = requestAnimationFrame(renderPulse);
      }

      source.onended = () => {
        activeSource = null;
        if (animFrameId) {
          cancelAnimationFrame(animFrameId);
          animFrameId = null;
        }
        resetCoreVisuals();
        setReadout('STANDBY // ONLINE');
      };

      setReadout('TRANSMITTING // VOICE ACTIVE');
      source.start(0);
      renderPulse();
    }

    // --- Interactive Controls ---
    btnPrompt.addEventListener('click', () => {
      commandBar.classList.toggle('active');
      btnPrompt.classList.toggle('active');
      if (commandBar.classList.contains('active')) {
        ttsInput.focus();
      }
    });

    jarvisOrb.addEventListener('click', () => {
      ensureAudioContext();
      const { apiKey } = loadConfig();
      if (!apiKey) {
        syncModalInputs();
        configModal.classList.add('open');
        return;
      }
      if (!commandBar.classList.contains('active')) {
        commandBar.classList.add('active');
        btnPrompt.classList.add('active');
        ttsInput.focus();
      } else if (ttsInput.value.trim()) {
        const line = ttsInput.value.trim();
        ttsInput.value = '';
        speakWithElevenLabs(line);
      } else {
        speakWithElevenLabs('At your service, sir. All systems are standing by.');
      }
    });

    ttsForm.addEventListener('submit', (e) => {
      e.preventDefault();
      ensureAudioContext();
      const val = ttsInput.value.trim();
      if (!val) return;
      ttsInput.value = '';
      speakWithElevenLabs(val);
    });

    btnTestAudio.addEventListener('click', () => {
      ensureAudioContext();
      speakWithElevenLabs('J.A.R.V.I.S. tactical interface online. ElevenLabs telemetry nominal.');
    });

    btnMute.addEventListener('click', () => {
      isMuted = !isMuted;
      btnMute.classList.toggle('active', isMuted);
      if (isMuted) {
        stopCurrentAudio();
        setReadout('AUDIO OUTPUT MUTED');
      } else {
        setReadout('AUDIO OUTPUT RESTORED');
      }
    });

    // Browser Speech Recognition -> ElevenLabs Voice Synthesis
    btnMic.addEventListener('click', () => {
      ensureAudioContext();
      const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRec) {
        commandBar.classList.add('active');
        btnPrompt.classList.add('active');
        ttsInput.focus();
        setReadout('SPEECH MIC UNSUPPORTED // USE TEXT INPUT', true);
        return;
      }

      const recognition = new SpeechRec();
      recognition.lang = 'en-US';
      recognition.interimResults = false;

      recognition.onstart = () => {
        btnMic.classList.add('active');
        setReadout('LISTENING // SPEAK NOW...');
      };

      recognition.onresult = (event) => {
        const transcript = event.results?.[0]?.[0]?.transcript;
        if (transcript) {
          ttsInput.value = transcript;
          speakWithElevenLabs(transcript);
        }
      };

      recognition.onerror = () => {
        setReadout('VOICE CAPTURE CANCELLED', true);
      };

      recognition.onend = () => {
        btnMic.classList.remove('active');
      };

      recognition.start();
    });

    // Initialize on load
    syncModalInputs();
  </script>
</body>
</html>
